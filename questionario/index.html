<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulado ETEC 2027 · 模擬試験</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  
  /* Paleta Clean com Cores Pontuais Swag */
  --bg: #ffffff; /* Fundo branco puro */
  --tx: #000000; /* Texto principal preto */
  --title: #000080; /* Azul Marinho Clássico */
  --mu: #ff77e1; /* Rosa Choque pontual */
  --pr: #299aa7; /* Turquesa pontual */
  --bd: #d3d3d3; /* Cinza claro para bordas subtis */
  
  --ok: #459645; 
  --er: #ff0d0d; 
}

* { box-sizing: border-box; border-radius: 0 !important; }

body {
  margin: 0;
  background-color: var(--bg);
  color: var(--tx);
  /* Fonte clássica serifada misturada com sans-serif */
  font: 15px/1.6 "Times New Roman", Times, serif;
  min-height: 100vh;
}

/* Letras de UI em Sans-Serif para contraste com o texto Serifado */
button, small, .tag, .dots, .sub, .nav, header, .insta-topbar, .profile-info, .insta-divider {
  font-family: "Arial", "Helvetica", sans-serif;
}

.w { max-width: 800px; margin: 0 auto; padding: 20px 16px 60px; }

header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 40px;
  padding-bottom: 15px;
  border-bottom: 1px solid var(--bd);
}

.logo {
  width: auto; font-size: 24px; color: var(--tx); font-weight: normal; cursor: pointer;
}
.logo:hover { color: var(--mu); }

header h1 { font-size: 16px; margin: 0; color: var(--tx); text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
header small { color: #666; font-size: 11px; letter-spacing: 2px; }
.sp { flex: 1; }

button { font: inherit; cursor: pointer; color: inherit; background: none; border: none; }

/* Botões Minimalistas Textuais / Outline */
.btn, .dots button {
  border: 1px solid var(--tx);
  background: transparent;
  color: var(--tx);
  padding: 6px 12px;
  font-size: 12px;
  text-transform: uppercase;
  transition: all 0.2s;
  letter-spacing: 1px;
}
.btn:hover, .dots button:hover {
  border-color: var(--pr);
  color: var(--pr);
}
.btn.g { border-color: var(--mu); color: var(--mu); }
.btn.g:hover { background: var(--mu); color: #fff; }
.btn:disabled { border-color: var(--bd); color: var(--bd); cursor: not-allowed; }

/* ---------------------------------------------------
   ★ PERFIL "SWAGSTAGRAM" MINIMALISTA ★
   --------------------------------------------------- */
.insta-profile {
  border: 1px solid var(--bd);
  background: var(--bg);
  margin-bottom: 30px;
}
.insta-topbar {
  background: var(--tx);
  color: var(--bg);
  padding: 8px;
  font-weight: bold;
  text-align: center;
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.insta-header {
  display: flex;
  gap: 20px;
  padding: 20px;
  align-items: center;
}
.profile-pic {
  width: 90px;
  height: 90px;
  border: 1px solid var(--bd);
  padding: 5px;
  object-fit: contain;
}
.profile-info {
  flex: 1;
}
.profile-info h2 {
  margin: 0 0 10px;
  font-size: 18px;
  text-transform: lowercase;
  letter-spacing: -1px;
  color: var(--title);
}
.stats {
  display: flex;
  gap: 15px;
  margin-bottom: 10px;
  font-size: 12px;
  color: #555;
}
.stats span { font-weight: normal; }
.stats span b { font-size: 14px; color: var(--tx); font-weight: bold; }
.bio {
  font-size: 12px;
  line-height: 1.4;
  margin-bottom: 15px;
  color: #333;
}
.bio-link {
  color: var(--title);
  text-decoration: underline;
  cursor: pointer;
  font-weight: bold;
}
.bio-link:hover { color: var(--mu); }
.insta-divider {
  border-top: 1px solid var(--bd);
  display: flex;
  justify-content: center;
  gap: 40px;
  padding: 10px 0;
  font-size: 11px;
  text-transform: uppercase;
  color: #888;
}
.insta-divider span { cursor: pointer; }
.insta-divider span.active { color: var(--tx); border-bottom: 1px solid var(--tx); padding-bottom: 2px; }

.insta-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--bd);
  border-top: 1px solid var(--bd);
}
.insta-grid .post {
  aspect-ratio: 1 / 1;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.insta-grid .post:hover { opacity: 0.7; }
.insta-grid .post img {
  max-width: 100%;
  max-height: 100%;
}

/* --------------------------------------------------- */
/* Hero Section */
.hero {
  text-align: center;
  margin-bottom: 50px;
  padding: 20px 0;
}
.hero h2 { 
  margin: 0 0 10px; font-size: 24px; color: var(--title); 
  font-family: "Arial", sans-serif; text-transform: uppercase; letter-spacing: 2px;
}
.hero p { margin: 0 auto 20px; color: #333; max-width: 600px; }

h3 { 
  margin: 30px 0 15px; color: var(--title); font-size: 14px; text-transform: uppercase; 
  font-family: "Arial", sans-serif; letter-spacing: 1px; border-bottom: 1px solid var(--bd); padding-bottom: 5px; 
}

/* Grid de Matérias */
.grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap: 20px; }

.card { 
  padding: 20px 10px; text-align: center; background: transparent; 
  border: 1px solid transparent; transition: all 0.2s; display: flex; flex-direction: column; justify-content: center; 
  cursor: pointer;
}
.card:hover { border-color: var(--pr); }
.card .e { height: 90px; display: grid; place-items: center; margin-bottom: 10px; }

.card .e img { 
  max-width: 100%; max-height: 90px; 
  transition: transform 0.2s;
}
.card:hover .e img { transform: scale(1.05); filter: drop-shadow(2px 2px 0px var(--pr)); }

.card b { display: block; margin-top: 5px; font-size: 14px; color: var(--title); font-family: "Arial", sans-serif; text-transform: uppercase; }
.card span { color: #888; font-size: 11px; }

.lv { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; margin-bottom: 10px; border: 1px solid var(--bd); padding: 10px; transition: 0.2s; }
.lv:hover { border-color: var(--mu); }
.tag { font-size: 10px; font-weight: normal; padding: 2px 6px; text-transform: uppercase; letter-spacing: 1px; border: 1px solid; }
.t0 { color: var(--pr); border-color: var(--pr); }
.t1 { color: #aaaaaa; border-color: #aaaaaa; } 
.t2 { color: var(--mu); border-color: var(--mu); } 

.back { font-size: 11px; text-decoration: underline; color: var(--title); text-transform: uppercase; margin-bottom: 20px; }
.back:hover { color: var(--mu); }

/* Barra de progresso ultra fina */
.bar { height: 2px; background: var(--bd); margin: 10px 0 30px; }
.bar i { display: block; height: 100%; background: var(--tx); }

.q { font-size: 18px; white-space: pre-line; color: var(--tx); margin-bottom: 20px; line-height: 1.5; }

/* Alternativas (estilo lista limpa) */
.op { 
  display: flex; gap: 15px; align-items: flex-start; width: 100%; text-align: left; 
  padding: 10px 5px; border-bottom: 1px dotted var(--bd); font-family: "Arial", sans-serif; font-size: 13px; cursor: pointer; transition: background 0.1s;
}
.op:hover { background: #fafafa; color: var(--pr); }
.op.s { background: #fff; border-bottom: 1px solid var(--tx); font-weight: bold; color: var(--mu); }
.op b { min-width: 20px; font-size: 12px; color: #888; }
.op.s b { color: var(--mu); }

.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 40px; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 30px; }
.dots button { width: 26px; height: 26px; padding: 0; font-size: 11px; }
.dots .a { background: #f0f0f0; border-color: #ccc; color: #666; }
.dots .c { background: var(--tx); color: #fff; border-color: var(--tx); }

.sc { text-align: center; padding: 40px 0; border-bottom: 1px solid var(--bd); margin-bottom: 30px; }
.sc .n { font-size: 40px; color: var(--title); font-family: "Arial", sans-serif; margin-bottom: 10px; }
.st { display: flex; justify-content: center; gap: 24px; margin: 15px 0 30px; font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; }

.r { padding: 15px 0; margin-bottom: 15px; border-bottom: 1px dotted var(--bd); font-family: "Arial", sans-serif; font-size: 13px; }
.r p { margin: 5px 0; font-family: "Times New Roman", serif; font-size: 16px; }
.ex { font-style: italic; color: #666; margin-top: 10px; font-size: 14px; font-family: "Times New Roman", serif; }

.g1 { color: var(--ok); }
.g2 { color: var(--mu); }
.sub { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }

.ft { display: flex; gap: 10px; margin-bottom: 20px; }
.ft button { font-size: 11px; border: 1px solid var(--bd); }
.ft .on { border-color: var(--tx); color: var(--tx); background: #f9f9f9; font-weight: bold; }


.btn-resume {
  margin-bottom: 12px;
  border-color: var(--pr);
  color: var(--pr);
  font-weight: bold;
  transition: all 0.25s ease;
}


.btn-resume:hover {
  background-color: var(--pr) !important; 
  color: #ffffff !important;     
  border-color: var(--pr) !important;
  transform: translateY(-2px);         
  box-shadow: 0 4px 10px rgba(41, 154, 167, 0.35); /* 
}


.btn-resume:active {
  transform: translateY(0);
}
</style>
</head>

  ["qui",2,"O modelo atômico de Rutherford-Bohr estabeleceu que:",["Os átomos são indivisíveis.","Os elétrons giram em órbitas com níveis de energia quantizados.","O núcleo é formado apenas por nêutrons.","Os elétrons estão imersos numa massa positiva.","Não há espaços vazios no átomo."],1,"Bohr aprimorou Rutherford propondo as órbitas estacionárias e quantizadas para os elétrons."],
  ["qui",2,"Quantos mols de NaOH são necessários para neutralizar 2 mols de H₂SO₄?",["1 mol","2 mols","3 mols","4 mols","5 mols"],3,"A reação é H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O. A proporção é 1:2. Para 2 mols do ácido, precisa-se de 4 mols da base."],

  ["qui",2,"A nomenclatura IUPAC correta para o composto orgânico H₃C-CH₂-OH é:",["Metanol","Propanol","Etanol","Etanal","Ácido etanoico"],2,"Prefixo Et (2 carbonos) + infixo an (ligação simples) + sufixo ol (função álcool)."],
  ["qui",2,"De acordo com o Princípio de Le Chatelier, ao aumentarmos a temperatura de um sistema em equilíbrio, ele se desloca:",["No sentido da reação exotérmica.","No sentido da reação endotérmica.","Não sofre deslocamento.","No sentido da formação dos reagentes apenas.","No sentido da formação dos gases."],1,"O sistema tenta 'anular' a perturbação absorvendo o calor extra, deslocando-se para o lado endotérmico."],

  ["qui",2,"Considerando a reação N₂ + 3H₂ → 2NH₃, qual a massa de amônia (NH₃) produzida a partir de 14 g de N₂? (Massas: N=14, H=1)",["17 g","34 g","51 g","68 g","8 g"],1,"1 mol de N₂ (28 g) produz 2 mols de NH₃ (2 × 17 = 34 g). Como 14 g é meia proporção, produzirá 1 mol = 17 g. Espera, 14g de N2 é 0,5 mol. 0,5 mol N2 produz 1 mol de NH3 = 17g."],
  ["qui",2,"Reavaliando a estequiometria: N₂(28g) produz 2NH₃(34g). Se uso 14g de N₂ (metade), quanto NH₃ é produzido?",["8.5 g","17 g","34 g","68 g","14 g"],1,"Se 28g de N₂ produzem 34g, então 14g produzem 17g de NH₃."],

  ["qui",2,"Na eletrólise ígnea do cloreto de sódio (NaCl), os produtos formados no cátodo e no ânodo são, respectivamente:",["Na e Cl₂","Na⁺ e Cl⁻","H₂ e O₂","H₂ e Cl₂","Na e O₂"],0,"Cátodo atrai cátions (Na⁺ sofre redução para Na metálico); Ânodo atrai ânions (Cl⁻ sofre oxidação para gás Cl₂)."],
  ["qui",2,"A presença de ligações duplas conjugadas em cadeias carbônicas longas está relacionada com qual propriedade macroscópica?",["Alto ponto de fusão","Cor (absorção de luz visível)","Solubilidade em água","Acidez","Condutividade elétrica no estado sólido"],1,"Os elétrons pi conjugados absorvem comprimentos de onda da luz visível, conferindo cor (ex: betacaroteno)."],
  ["qui",2,"Qual das soluções abaixo apresenta a maior temperatura de ebulição (efeito ebulioscópico)?",["1,0 mol/L de Glicose (C₆H₁₂O₆)","1,0 mol/L de NaCl","1,0 mol/L de CaCl₂","1,0 mol/L de Sacarose (C₁₂H₂₂O₁₁)","0,5 mol/L de AlCl₃"],2,"O CaCl₂ dissocia-se em 3 íons (Ca²⁺ e 2 Cl⁻), gerando concentração final de partículas de 3,0 mol/L, a maior entre as opções."],

  ["qui",2,"Segundo a lei das proporções definidas (Proust), se 2 g de hidrogênio reagem com 16 g de oxigênio para formar 18 g de água, quanto de água se forma com 4 g de hidrogênio e oxigênio em excesso?",["18 g","36 g","20 g","40 g","72 g"],1,"A proporção dobrou (de 2 g para 4 g de H). A massa do produto também dobrará (de 18 g para 36 g)."],

  ["qui",2,"A força intermolecular presente nas moléculas de água (H₂O) e responsável pelo seu anômalo ponto de ebulição é:",["Dipolo induzido","Dipolo-dipolo","Força de London","Ligação de hidrogênio (Ponte de H)","Interação íon-dipolo"],3,"O H ligado a O (átomo altamente eletronegativo) cria polos fortes, formando ligações de hidrogênio com outras moléculas."],
  ["qui",2,"Qual das opções a seguir é uma função oxigenada?",["Amina","Amida","Cetona","Nitrila","Haleto orgânico"],2,"As cetonas possuem o grupo carbonila (C=O) entre carbonos, contendo assim o oxigênio."],
  ["qui",2,"A energia de ionização é uma propriedade periódica que cresce na Tabela Periódica no sentido:",["De cima para baixo e da direita para a esquerda.","De baixo para cima e da esquerda para a direita.","De cima para baixo e da esquerda para a direita.","De baixo para cima e da direita para a esquerda.","Aleatoriamente conforme a massa."],1,"Geralmente aumenta ao longo do período para a direita e sobe nos grupos, pois os elétrons estão mais atraídos pelo núcleo (menor raio atômico)."],
  ["qui",2,"Num reator, 10 mols de A e 10 mols de B reagem (A + 2B → C). Qual é o reagente limitante?",["A","B","C","Nenhum","Ambos"],1,"Pela estequiometria, 1 mol de A precisa de 2 mols de B. Para 10 mols de A, precisaríamos de 20 de B. Como só temos 10 de B, o B vai acabar primeiro (limitante)."],

  ["fis",1,"Um circuito tem resistência de 10 Ω e é ligado a uma bateria de 50 V. Qual é a corrente elétrica?",["0,2 A","5 A","10 A","500 A","60 A"],1,"Pela Primeira Lei de Ohm: V = R × i → 50 = 10 × i → i = 5 A."],
  ["fis",1,"Quando mergulhamos um canudo em um copo com água, ele parece estar 'quebrado'. Isso se deve à:",["Reflexão total","Refração da luz","Interferência luminosa","Polarização da luz","Dispersão da luz"],1,"A luz muda de velocidade ao passar do ar para a água, desviando sua trajetória (refração)."],
  ["fis",1,"Um bloco cai em queda livre de uma ponte. Desprezando a resistência do ar, sua aceleração é:",["Zero","Variável, aumentando com o tempo","Constante, igual à gravidade local","Constante, dependente da massa do bloco","Nula até atingir o chão"],2,"Em queda livre, a única aceleração atuando é a da gravidade (g ≈ 10 m/s²), constante para todas as massas."],
  ["fis",1,"Se a frequência de uma onda é 50 Hz, seu período (T) é:",["50 s","5 s","0,5 s","0,02 s","100 s"],3,"Frequência e período são inversos: T = 1/f = 1/50 = 0,02 s."],
  ["fis",1,"A energia potencial gravitacional de um objeto de 2 kg elevado a 5 metros de altura (use g = 10 m/s²) é:",["10 J","20 J","50 J","100 J","200 J"],3,"Ep = m × g × h = 2 × 10 × 5 = 100 Joules."],
  ["fis",1,"O som é classificado como uma onda mecânica e:",["Transversal","Eletromagnética","Longitudinal","Polarizada","Sismológica estática"],2,"Ondas sonoras são longitudinais: a vibração ocorre na mesma direção da propagação."],
  ["fis",1,"No interior de uma garrafa térmica bem vedada, evita-se a troca de calor por:",["Apenas condução","Apenas convecção","Apenas irradiação","Condução, convecção e irradiação","Reflexão e refração apenas"],3,"O vácuo evita condução e convecção; o vidro espelhado evita a irradiação."],
  ["fis",1,"Se um fio condutor tem sua espessura (área da seção) dobrada, mantendo o mesmo comprimento e material, sua resistência elétrica:",["Dobra","Quadruplica","Fica igual","Cai pela metade","Reduz a 1/4"],3,"Resistência é inversamente proporcional à área (Segunda Lei de Ohm). Área dobra = Resistência cai à metade."],
  ["fis",1,"Um motor elétrico realiza um trabalho de 600 J em 10 segundos. A potência do motor é:",["6 W","60 W","600 W","6000 W","10 W"],1,"Potência = Trabalho / Tempo = 600 / 10 = 60 W."],
  ["fis",1,"No Movimento Circular Uniforme (MCU), a velocidade escalar é constante, mas há aceleração:",["Tangencial","Linear nula","Centrípeta","Inercial","Gravitacional"],2,"A aceleração centrípeta puxa para o centro, mudando apenas a direção e sentido do vetor velocidade."],
  ["fis",1,"Duas cargas elétricas pontuais atraem-se. Se a distância entre elas dobrar, a força elétrica:",["Dobra","Reduz à metade","Fica quatro vezes maior","Reduz a 1/4 da original","Fica igual"],3,"Pela Lei de Coulomb, a força é inversamente proporcional ao quadrado da distância (2² = 4)."],
  ["fis",1,"O fenômeno que permite a transmissão de dados por fibra óptica sem perder luz pela casca do fio é a:",["Refração dupla","Reflexão interna total","Difração total","Polarização","Interferência"],1,"A luz reflete totalmente nas paredes internas porque atinge o ângulo limite de refração."],
  ["fis",1,"Uma bicicleta possui engrenagens de raios diferentes conectadas por corrente. As bordas das duas catracas possuem a mesma:",["Velocidade angular","Frequência","Aceleração angular","Período","Velocidade linear"],4,"A corrente transmite a mesma velocidade linear (v) para as bordas das catracas conectadas."],
  ["fis",1,"O equivalente em graus Celsius para a temperatura de 300 Kelvin (K) é, aproximadamente:",["0 °C","27 °C","100 °C","300 °C","573 °C"],1,"Celsius = Kelvin - 273. Logo, 300 - 273 = 27 °C."],
  ["fis",1,"Num espelho plano, a imagem formada é:",["Real, direita e menor","Virtual, direita e do mesmo tamanho","Virtual, invertida verticalmente e maior","Real, invertida e do mesmo tamanho","Virtual, invertida e menor"],1,"Em espelhos de banheiro (planos), a imagem é virtual (atrás do espelho), direita e de mesmo tamanho, sofrendo apenas reversão lateral."],
  ["fis",1,"A pressão atmosférica ao nível do mar vale cerca de 1 atm. A cada 10 metros de profundidade na água, a pressão hidrostática:",["Diminui 1 atm","Aumenta 10 atm","Aumenta 1 atm","Aumenta 0,1 atm","Permanece constante"],2,"Pelo Teorema de Stevin, 10 metros de coluna d'água exercem pressão equivalente a 1 atm."],
  ["fis",1,"Ao esticar uma mola em 0,2 metros, ela gera uma força elástica de 10 N. Qual a sua constante elástica (k)?",["2 N/m","5 N/m","20 N/m","50 N/m","100 N/m"],3,"Pela Lei de Hooke (F = k × x) -> 10 = k × 0,2 -> k = 50 N/m."],
  ["fis",1,"Em dias frios, usamos blusas de lã porque a lã é:",["Um excelente condutor de frio.","Um bom absorvedor de calor do ambiente.","Um gerador de calor contínuo.","Um isolante térmico que dificulta a perda de calor do corpo.","Um material com alta condutividade térmica."],3,"A lã (e o ar preso nela) atua como isolante térmico natural, retendo o calor humano."],
  ["fis",1,"Dois resistores de 6 Ω estão associados em paralelo. A resistência equivalente do circuito é:",["12 Ω","6 Ω","3 Ω","2 Ω","36 Ω"],2,"Em resistores iguais em paralelo, Re = R / n = 6 / 2 = 3 Ω."],
  ["fis",1,"Num gráfico de Velocidade x Tempo no Movimento Uniformemente Variado (MRUV), a área sob a reta representa:",["A aceleração","O trabalho realizado","A distância percorrida (deslocamento)","A força resultante","A variação do tempo"],2,"A área do gráfico V × t é numericamente igual ao deslocamento (ΔS)."],
  ["fis",1,"Uma panela de pressão cozinha os alimentos mais rápido porque:",["Retém o vapor, aumentando a pressão e elevando o ponto de ebulição da água.","Diminui a pressão interna, fazendo a água ferver a 80°C.","Aumenta a condução de calor apenas pelas bordas.","Impedindo a luz, concentra mais o calor específico.","Retira o oxigênio do interior, cozinhando a vácuo."],0,"Com pressão maior que 1 atm, a água ferve a cerca de 115-120 °C, cozinhando o alimento muito mais rápido."],

  ["fis",2,"Um corpo de 2 kg é abandonado a 20 m de altura. Se a colisão com o solo dura 0,1 s, qual a força média de impacto? (Despreze o ar, g=10 m/s², choque inelástico)",["100 N","200 N","400 N","1000 N","2000 N"],2,"Velocidade ao chegar ao chão: V = √(2gh) = √(2*10*20) = 20 m/s. Impulso = ΔQ -> F*t = m*Δv -> F*0,1 = 2*20 -> F = 400 N."],
  ["fis",2,"No Efeito Doppler, quando uma ambulância com sirene ligada se AFASTA de um observador parado, este percebe o som:",["Mais agudo (frequência maior)","Mais grave (frequência menor)","Com o mesmo tom, mas intensidade maior","Com frequência inalterada","Infra-sônico"],1,"Ao se afastar, as frentes de onda 'esticam', resultando em um comprimento de onda maior e som mais grave (menor f)."],
  ["fis",2,"Uma máquina térmica teórica de Carnot opera entre fontes de 300 K e 600 K. O seu rendimento máximo é:",["30%","50%","75%","100%","200%"],1,"Rendimento = 1 - (Tfria / Tquente) = 1 - (300/600) = 1 - 0,5 = 0,5 = 50%."],
  ["fis",2,"Um feixe de luz monocromática passa do ar (n=1) para um líquido, formando ângulo de incidência de 30° e de refração de 45°? (Isto fisicamente violaria Snell se v_ar > v_liq, vejamos...)",["Essa situação é impossível se a luz vier do meio menos refringente para o mais refringente.","Refletirá totalmente.","Causará difração.","Polarizará 100%.","A luz vai parar na interface."],0,"O ângulo de refração deve aproximar-se da normal (ser menor que 30°) se o líquido tiver índice n > 1. Assim, o ângulo 45° é impossível nessa ordem."],
  ["fis",2,"Num circuito, 3 lâmpadas de mesma resistência (R) estão em série. Se uma queimar, o que ocorre?",["As outras brilham mais.","As outras brilham menos.","Todas apagam.","Uma pisca, a outra brilha.","A corrente dobra."],2,"Em um circuito série puro, há apenas um caminho para a corrente. Uma lâmpada queimada interrompe o circuito totalmente."],
  ["fis",2,"Lança-se um projétil obliquamente num ângulo de 45°. Se a resistência do ar for desprezada, o alcance do projétil é:",["Nulo.","O menor possível.","O máximo possível para a mesma velocidade inicial.","Dependente da massa do projétil apenas.","Infinito."],2,"Na cinemática clássica sem atrito, o alcance horizontal de um lançamento oblíquo é máximo com o ângulo de 45°."],
  ["fis",2,"Qual princípio da hidrostática justifica o funcionamento do macaco hidráulico?",["Princípio de Arquimedes","Princípio de Bernoulli","Princípio de Stevin","Princípio de Pascal","Princípio de Torricelli"],3,"Princípio de Pascal: uma pressão aplicada a um fluido fechado é transmitida integralmente para todos os pontos do fluido."],
  ["fis",2,"Na miopia, a imagem dos objetos distantes forma-se:",["Atrás da retina, corrigindo-se com lentes convexas.","Antes da retina, corrigindo-se com lentes divergentes (côncavas).","Exatamente na retina, mas sem nitidez.","No nervo óptico, exigindo lentes cilíndricas.","Na córnea, não tendo cura óptica."],1,"O globo ocular alongado faz a imagem se formar antes. Lentes divergentes espalham a luz para que foque mais atrás, na retina."],
  ["fis",2,"Um condutor de 2 metros é movido com velocidade de 5 m/s num campo magnético de 0,5 T. A força eletromotriz induzida é:",["2 V","5 V","10 V","2,5 V","0,5 V"],1,"F.E.M. induzida (E) = B × L × v = 0,5 × 2 × 5 = 5 V (Lei de Faraday-Neumann)."],
  ["fis",2,"Na Segunda Lei da Termodinâmica (Entropia), é afirmado que:",["Toda a energia do universo se converte 100% em trabalho.","O calor flui naturalmente do corpo frio para o quente.","Em sistemas isolados, a desordem (entropia) tende sempre a aumentar.","O rendimento de máquinas reais pode ser 100%.","No zero absoluto, o movimento das moléculas é infinito."],2,"A entropia mede a desordem. Processos naturais levam a um aumento contínuo da entropia do universo."],
  ["fis",2,"O pêndulo simples tem seu período (T) dependente apenas da:",["Massa e amplitude","Massa e gravidade","Comprimento do fio e gravidade","Comprimento e massa","Temperatura e densidade do ar"],2,"A fórmula do período é T = 2π √(L/g), independendo da massa (para pequenas oscilações)."],
  ["fis",2,"Numa colisão perfeitamente elástica entre duas esferas ideais, conserva-se:",["Apenas a quantidade de movimento.","Apenas a energia mecânica.","A energia mecânica, mas não a quantidade de movimento.","Ambas, a energia cinética total e a quantidade de movimento.","Nenhuma das alternativas."],3,"Colisões elásticas não dissipam energia em calor ou som e conservam o momento linear total."],
  ["fis",2,"Sobre um bloco de 5 kg sobre uma mesa, atua um coeficiente de atrito estático de 0,4. Qual a força mínima para iniciá-lo? (g=10)",["10 N","20 N","30 N","40 N","50 N"],1,"Força de atrito estático máx = μe × N = 0,4 × (5 × 10) = 0,4 × 50 = 20 N."],
  ["fis",2,"O Princípio da Conservação da Quantidade de Movimento explica fundamentalmente o:",["O fato de os planetas serem esféricos.","O recuo de uma arma de fogo ao atirar.","A atração dos metais por ímãs.","A formação do arco-íris.","O aumento de pressão nos pneus quentes."],1,"O sistema estava em repouso (Q=0). Se o tiro vai pra frente (+mv), a arma deve ir pra trás (-Mv) para a soma continuar 0."],
  ["fis",2,"Na experiência de Young da dupla fenda, as franjas claras e escuras no anteparo comprovam o caráter:",["Básico e magnético da luz","Particulado da luz (fótons)","Ondulatório da luz (interferência)","Gravitacional da luz","Velocidade limite universal"],2,"O padrão de interferência construtiva e destrutiva demonstra a natureza de onda da luz."],
  ["fis",2,"A capacidade térmica (C) de um corpo é igual à sua massa (m) multiplicada por seu:",["Calor latente","Calor específico (c)","Densidade","Volume","Potencial calorífico"],1,"C = m × c. A capacidade térmica refere-se ao corpo todo, enquanto o calor específico é próprio do material."],
  ["fis",2,"Num gás ideal passando por uma transformação isotérmica, se o volume dobrar, a pressão:",["Dobra.","Cai pela metade.","Permanece a mesma.","Cai a um quarto.","Triplica."],1,"Lei de Boyle (P1*V1 = P2*V2). Se a temperatura é constante, Pressão e Volume são inversamente proporcionais."],
  ["fis",2,"Calor latente (L) é a quantidade de calor absorvida ou liberada por uma massa durante:",["Apenas o aumento de temperatura até 100°C.","Apenas no vácuo absoluto.","A transição de fase (mudança de estado) sem alteração de temperatura.","A aceleração térmica.","A compressão de gases perfeitos."],2,"Na mudança de estado, a temperatura não muda, toda a energia é usada para reagrupar as ligações (Q = m × L)."],
  ["fis",2,"Dois capacitores idênticos (C) associados em paralelo possuem capacitância equivalente igual a:",["C/2","C","2C","4C","C²"],2,"Diferente dos resistores, a capacitância equivalente em paralelo é a soma das capacitâncias: C + C = 2C."],
  ["fis",2,"A relação de Broglie (Ondas de Matéria) diz que o comprimento de onda de uma partícula está associado inversamente a:",["Seu momento linear (quantidade de movimento)","Sua carga elétrica nula","Ao volume da partícula","Seu momento magnético intrínseco","À temperatura de radiação do corpo negro"],0,"λ = h / p (onde p é o momento linear m×v). Partículas também têm comportamento ondulatório (Dualidade)."],
  ["fis",2,"Ao girar uma pedra presa num barbante e o fio arrebentar subitamente, a pedra sairá:",["Em linha reta na direção tangencial à trajetória.","Numa trajetória parabólica contornando a mão.","Em direção reta rumo ao centro.","Retornando ao ponto inicial pela gravidade instantânea.","Voando perpendicularmente ao plano de rotação."],0,"Sem a força centrípeta (fio), pela inércia, o objeto mantém sua velocidade vetorial, saindo pela tangente do círculo."],
  ["fis",2,"Qual das unidades NÃO é de energia no SI nem no cotidiano comercial?",["Joule (J)","Quilowatt-hora (kWh)","Caloria (cal)","Watt (W)","Elétron-volt (eV)"],3,"Watt (W) é unidade de Potência (Energia por tempo, Joules por segundo), não de Energia pura."],
  ["fis",2,"A experiência na qual o ferro é atraído pelo polo magnético da Terra explica-se pois o ferro é um material:",["Diamagnético (repele campos fracos)","Apenas isolante elétrico","Ferromagnético (domínios se alinham fortemente)","Paramagnético puro (atração muito fraca e dependente de temperatura)","Dielétrico (capaz de acumular muita carga)"],2,"Materiais ferromagnéticos têm alta permeabilidade magnética, criando ímãs artificiais fortes."],
  ["fis",2,"Um gerador tem f.e.m. de 12 V e resistência interna 1 Ω. Ao ligá-lo a um resistor de 5 Ω, a corrente é:",["1 A","2 A","12 A","2,4 A","6 A"],1,"I = E / (R + r) = 12 / (5 + 1) = 12 / 6 = 2 A (Equação do Gerador ou Lei de Pouillet)."],
  ["fis",2,"No decaimento Beta (β) de um núcleo radioativo, uma das partículas emitidas essencialmente é:",["Um núcleo de hélio-4 (dois prótons e dois nêutrons).","Um raio gama puramente energético.","Um elétron de alta energia gerado no núcleo.","Um átomo de hidrogênio completo.","Um nêutron instável de vida longa."],2,"Na radiação Beta, um nêutron converte-se num próton (que fica no núcleo) e ejeta um elétron (partícula β)."],

  ["geo",0,"O movimento que a Terra realiza em torno do seu próprio eixo é chamado de:",["Translação","Rotação","Nutação","Precessão","Revolução"],1,"A rotação é responsável pela sucessão dos dias e das noites, durando aproximadamente 24 horas."],
  ["geo",0,"A linha imaginária que divide a Terra em hemisfério Norte e Sul é:",["Trópico de Câncer","Trópico de Capricórnio","Linha do Equador","Meridiano de Greenwich","Círculo Polar Ártico"],2,"A Linha do Equador é o paralelo de 0° que divide o planeta horizontalmente."],

  ["geo",0,"Qual é o oceano que banha todo o litoral do Brasil?",["Pacífico","Índico","Glacial Ártico","Atlântico","Antártico"],3,"O Brasil possui uma extensa costa leste banhada exclusivamente pelo Oceano Atlântico."],
  ["geo",0,"O fenômeno natural responsável por manter o planeta aquecido e permitir a vida na Terra é o:",["Buraco na camada de ozônio","Aquecimento global","Efeito estufa","El Niño","Inversão térmica"],2,"O efeito estufa é um fenômeno natural benéfico; o seu agravamento (pela poluição) é que gera o aquecimento global."],
  ["geo",0,"A Caatinga é um bioma exclusivamente brasileiro. Em qual região ela predomina?",["Sul","Sudeste","Norte","Nordeste","Centro-Oeste"],3,"A Caatinga é típica do clima semiárido, predominante no sertão nordestino."],
  ["geo",0,"O principal setor da economia que abrange o comércio e a prestação de serviços é o:",["Setor Primário","Setor Secundário","Setor Terciário","Setor Quaternário","Setor Agrícola"],2,"O setor terciário é o de maior participação no PIB brasileiro (comércio e serviços)."],
  ["geo",0,"A representação gráfica em tamanho reduzido da superfície terrestre chama-se:",["Bússola","Escala","Mapa","Croqui","Maquete"],2,"O mapa é a representação cartográfica plana de uma área da superfície terrestre."],
  ["geo",0,"A camada de gás que envolve o planeta Terra é a:",["Litosfera","Atmosfera","Hidrosfera","Biosfera","Astenosfera"],1,"A atmosfera protege a Terra e retém gases essenciais para a vida."],
  ["geo",0,"Qual continente é conhecido como o 'Berço da Humanidade'?",["Europa","Ásia","América","Oceania","África"],4,"A África recebe este título devido às descobertas dos fósseis humanos mais antigos."],
  ["geo",0,"O Meridiano de Greenwich divide a Terra em quais hemisférios?",["Norte e Sul","Norte e Ocidental","Oriental e Ocidental","Sul e Oriental","Polar e Equatorial"],2,"Greenwich (0°) divide a Terra verticalmente em Leste (Oriental) e Oeste (Ocidental)."],
  ["geo",0,"A saída de pessoas do seu país de origem para viver em outro é chamada de:",["Migração pendular","Imigração","Emigração","Êxodo rural","Nomadismo"],2,"Emigração é a saída (para o país de origem ele é emigrante); imigração é a entrada."],
  ["geo",0,"Qual país faz a maior fronteira terrestre com o Brasil?",["Argentina","Paraguai","Uruguai","Bolívia","Venezuela"],3,"A Bolívia faz a maior fronteira terrestre com o Brasil, com mais de 3.400 km."],
  ["geo",0,"Como é chamado o deslocamento diário de pessoas para trabalhar em uma cidade vizinha e voltar?",["Migração sazonal","Migração de retorno","Êxodo rural","Transumância","Migração pendular"],4,"Recebe este nome por lembrar o movimento de um pêndulo (vai e volta diariamente)."],
  ["geo",0,"O estado de São Paulo está localizado em qual região brasileira?",["Sul","Centro-Oeste","Nordeste","Sudeste","Norte"],3,"A região Sudeste é composta por São Paulo, Rio de Janeiro, Minas Gerais e Espírito Santo."],
  ["geo",0,"Qual é o maior país do mundo em extensão territorial?",["Canadá","Estados Unidos","China","Rússia","Brasil"],3,"A Rússia possui a maior extensão territorial do planeta, abrangendo a Europa e a Ásia."],
  ["geo",0,"O conjunto de todas as águas do planeta (oceanos, mares, rios e lagos) forma a:",["Litosfera","Biosfera","Atmosfera","Troposfera","Hidrosfera"],4,"'Hidro' significa água; a hidrosfera engloba toda a água da Terra."],
  ["geo",0,"A passagem do meio rural para o meio urbano, buscando melhores condições de vida, é o:",["Êxodo rural","Fuga de cérebros","Migração pendular","Nomadismo","Imigração"],0,"O êxodo rural impulsionou a urbanização do Brasil no século XX."],
  ["geo",0,"O clima predominante em grande parte da região Norte do Brasil, caracterizado por muito calor e chuvas constantes, é o:",["Tropical","Equatorial","Subtropical","Semiárido","Polar"],1,"O clima equatorial abrange a área da floresta Amazônica (próxima à Linha do Equador)."],
  ["geo",0,"Qual instrumento milenar, que utiliza o campo magnético da Terra, é usado para orientação?",["Astrolábio","GPS","Radar","Bússola","Telescópio"],3,"A bússola possui uma agulha imantada que aponta sempre para o polo norte magnético."],
  ["geo",0,"O Japão é um país formado por um conjunto de ilhas. Em geografia, isso é chamado de:",["Península","Istmo","Arquipélago","Estuário","Foz"],2,"Um arquipélago é um agrupamento de ilhas próximas umas das outras."],
  ["geo",0,"As estações do ano ocorrem principalmente devido a:",["Rotação da Terra.","Fases da Lua.","Translação da Terra e inclinação do eixo.","Mudanças nas marés.","Aquecimento global."],2,"A translação aliada à inclinação do eixo terrestre (23,5°) faz com que a luz solar incida de forma desigual durante o ano."],
  ["geo",0,"O Mercosul é um importante bloco econômico. O Brasil é um dos seus membros fundadores, junto com:",["EUA e Canadá","Argentina, Paraguai e Uruguai","Chile e Colômbia","China e Índia","México e Peru"],1,"Brasil, Argentina, Paraguai e Uruguai assinaram o Tratado de Assunção em 1991."],
  ["geo",0,"As florestas que perdem suas folhas durante uma estação fria ou seca são chamadas de:",["Equatoriais","Perenifólias","Caducifólias (decíduas)","Coníferas","Manguezais"],2,"Folhas 'caducas' são aquelas que caem em determinada época do ano como estratégia de sobrevivência."],

  ["his",0,"A civilização Inca habitava majoritariamente qual cadeia de montanhas?",["Himalaia","Alpes","Montanhas Rochosas","Cordilheira dos Andes","Cárpatos"],3,"O Império Inca dominou a região andina da América do Sul (hoje Peru, Bolívia, Equador, partes do Chile e Argentina)."],
  ["his",0,"A invenção que marcou a passagem da Pré-História para a História Antiga foi:",["A roda","O fogo","A agricultura","A escrita","A pólvora"],3,"O desenvolvimento da escrita (como a cuneiforme na Suméria) é o marco tradicional que divide esses dois períodos."],

  ["his",0,"O renascimento cultural e científico (séculos XIV a XVI) destacou grandes artistas, como o pintor da Mona Lisa. Seu nome é:",["Michelangelo","Donatello","Rafael","Leonardo da Vinci","Sandro Botticelli"],3,"Da Vinci foi o gênio renascentista, não apenas pintor, mas inventor, anatomista e engenheiro."],
  ["his",0,"No Brasil, os trabalhadores responsáveis por levar o café e as riquezas do interior até os portos, usando mulas, eram os:",["Bandeirantes","Jesuítas","Tropeiros","Gaudérios","Cangaceiros"],2,"Os tropeiros cruzavam o Brasil com tropas de mulas, facilitando o comércio e integrando as regiões."],

  ["his",1,"A política do 'Café com Leite', vigente na Primeira República do Brasil (República Velha), consistia na aliança e alternância de poder entre as oligarquias de quais estados?",["Rio de Janeiro e Bahia","São Paulo e Rio Grande do Sul","São Paulo e Minas Gerais","Minas Gerais e Pernambuco","São Paulo e Rio de Janeiro"],2,"As oligarquias paulista (forte no café) e mineira (forte na agropecuária e política) dominavam as eleições presidenciais."],
  ["his",1,"Qual foi o estopim imediato (motivo direto) para o início da Primeira Guerra Mundial em 1914?",["A invasão da Polônia pela Alemanha.","O assassinato do Arquiduque Francisco Ferdinando, da Áustria-Hungria.","O bombardeio a Pearl Harbor.","A quebra da Bolsa de Nova York.","A Revolução Russa."],1,"Ele foi assassinado em Sarajevo, gerando uma reação em cadeia devido ao sistema de alianças da Europa."],
  ["his",1,"O movimento iluminista (século XVIII) defendia:",["O direito divino dos reis absolutistas.","O uso da razão para alcançar o progresso, criticando os privilégios da nobreza e do clero.","A imposição da religião católica sobre os indígenas.","O retorno à vida rural e a rejeição das fábricas.","A submissão do Estado à Igreja."],1,"O Iluminismo foi a base ideológica da Revolução Francesa, defendendo igualdade perante a lei e a liberdade individual."],
  ["his",1,"A Consolidação das Leis do Trabalho (CLT), que garantiu férias, salário mínimo e jornada de 8 horas, foi instituída no Brasil no governo de:",["Juscelino Kubitschek","João Goulart","Fernando Henrique Cardoso","Getúlio Vargas","D. Pedro II"],3,"A CLT foi criada em 1943, durante o Estado Novo, na Era Vargas, unificando a legislação trabalhista brasileira."],
  ["his",1,"Na Revolução Francesa (1789), o lema que se popularizou foi:",["Paz, Pão e Terra","Ordem e Progresso","Liberdade, Igualdade e Fraternidade","Sangue, Suor e Lágrimas","Independência ou Morte"],2,"'Liberté, Égalité, Fraternité' tornou-se o grito de guerra dos revolucionários contra a monarquia e os privilégios sociais."],
  ["his",1,"Durante o período colonial brasileiro, os Bandeirantes paulistas ficaram conhecidos por:",["Ficarem isolados no litoral cultivando cana.","Serem representantes oficiais do Rei de Portugal no Brasil.","Aprearem (escravizarem) indígenas, buscarem ouro e expandirem as fronteiras do Brasil além de Tordesilhas.","Construírem as primeiras fábricas têxteis do país.","Serem padres jesuítas em missões de paz."],2,"As bandeiras, expedições particulares saídas de SP, desbravaram o sertão violentamente e acharam minas de ouro."],
  ["his",1,"A quebra da Bolsa de Valores de Nova York, em 1929 (a Grande Depressão), causou no Brasil a crise em qual produto de exportação?",["Borracha","Açúcar","Ouro","Algodão","Café"],4,"Os EUA eram os maiores compradores do café brasileiro. Com a crise, os preços despencaram e muitos barões do café faliram."],
  ["his",1,"Na Idade Média, o acordo de fidelidade mútua entre nobres, onde um doava terras (suserano) e o outro jurava proteção (vassalo), chamava-se:",["Capitalismo mercantil","Tratado de Vestfália","Relação de Suserania e Vassalagem","Sistema de Capitanias","Mercantilismo"],2,"Foi a base da estrutura feudal, criando uma rede de lealdades que fragmentou o poder político dos reis."],
  ["his",1,"A Inconfidência Mineira (1789) teve influência direta de qual evento/ideologia internacional?",["Revolução Russa","Independência dos Estados Unidos e Iluminismo","Expansão Napoleônica","Reforma Protestante","Revolução Industrial"],1,"Os inconfidentes, membros da elite, foram inspirados pelos ideais iluministas e pelo recente sucesso dos EUA em romper com a Inglaterra."],
  ["his",1,"Qual presidente brasileiro construiu Brasília e tinha como lema '50 anos em 5' no seu Plano de Metas?",["Jânio Quadros","João Goulart","Eurico Gaspar Dutra","Getúlio Vargas","Juscelino Kubitschek (JK)"],4,"JK promoveu forte industrialização (fábricas de automóveis) e interiorização da capital entre 1956 e 1961."],
  ["his",1,"A Revolução Russa de 1917 derrubou a monarquia do Czar Nicolau II e instaurou qual sistema político/econômico?",["Fascismo","Nazismo","Socialismo/Comunismo","Anarquismo","Capitalismo neoliberal"],2,"Liderada por Lenin, a Revolução Bolchevique transformou o país no primeiro Estado socialista da história (posterior URSS)."],
  ["his",1,"Qual foi a motivação principal para a expansão marítima europeia (Descobrimentos) no século XV?",["O desejo de provar que a Terra era plana.","Fugir da Peste Negra que devastava a Europa no século XV.","Buscar uma nova rota comercial para as Índias, visando quebrar o monopólio italiano sobre as especiarias.","Conquistar território para construir fábricas de tecidos.","Garantir rotas de imigração para o excedente populacional europeu."],2,"As especiarias (cravo, pimenta, canela) eram valiosíssimas; portugueses e espanhóis buscaram o mar para evitar a rota dominada por italianos e otomanos no Mediterrâneo."],
  ["his",1,"O movimento Reforma Protestante, iniciado em 1517 com 95 teses contra as indulgências da Igreja Católica, foi liderado por:",["João Calvino","Martinho Lutero","Henrique VIII","São Francisco de Assis","Papa Leão X"],1,"O monge alemão Martinho Lutero criticou os abusos da Igreja, causando o cisma no Cristianismo Ocidental."],
  ["his",1,"No Brasil, a Lei de Terras de 1850 estabeleceu que:",["Todas as terras seriam doadas aos escravos libertos.","A terra só poderia ser obtida por meio de compra, favorecendo grandes latifundiários.","O governo dividiria lotes para reforma agrária.","Os imigrantes receberiam terras gratuitas na região Sudeste.","Os indígenas retomariam o direito legal sobre todo o território."],1,"A lei dificultou o acesso à terra para os pobres, ex-escravos e imigrantes pequenos, concentrando-as nas mãos da elite."],
  ["his",1,"Guerra dos Farrapos, Sabinada, Balaiada e Cabanagem foram revoltas ocorridas em qual período da história do Brasil?",["Colônia (Ciclo do Ouro)","Período Joanino","Período Regencial (1831-1840)","Segundo Reinado","República da Espada"],2,"As revoltas regenciais ocorreram no vazio de poder deixado pela abdicação de D. Pedro I, quando D. Pedro II ainda era criança."],
  ["his",1,"'Voto de Cabresto' era uma prática comum na Primeira República no Brasil. O que significava?",["O voto através de urnas eletrônicas para evitar fraudes.","O voto secreto garantido pela Constituição de 1891.","O controle e manipulação do voto dos camponeses pelo coronel local (fazendeiro) através de violência ou favores.","O voto permitido apenas para as mulheres e militares.","Um imposto pago para poder votar."],2,"A figura do Coronel forçava seus dependentes a votar em quem ele apoiava, fraudando constantemente as eleições."],
  ["his",1,"Na Roma Antiga, os Patrícios eram:",["Escravos guerreiros.","Estrangeiros sem direitos.","Comerciantes pobres que lutavam por terras.","A classe da nobreza aristocrática e dona das melhores terras.","Os generais ditadores do Império."],3,"Os Patrícios dominavam o Senado, enquanto os Plebeus lutavam por participação política e direitos sociais."],
  ["his",1,"Na Guerra do Peloponeso (Grécia Antiga), as duas principais pólis (cidades-estado) que lideraram o conflito foram:",["Tróia e Cartago","Roma e Alexandria","Atenas e Esparta","Macedônia e Tebas","Pérsia e Atenas"],2,"O conflito foi entre a Liga de Delos (Atenas) e a Liga do Peloponeso (Esparta) pela hegemonia da Grécia."],
  ["his",1,"A Doutrina Monroe (1823), resumida pela frase 'A América para os americanos', determinava que:",["Os EUA não aceitariam novas interferências ou recolonizações europeias no continente americano.","A América inteira deveria falar inglês.","O Brasil seria anexado aos EUA.","A América deveria se isolar do comércio mundial.","Os países americanos não poderiam abolir a escravidão sem aviso prévio."],0,"Os EUA apoiaram as independências latino-americanas visando afastar as potências europeias e manter sua própria área de influência."],
  ["his",1,"A ditadura militar no Brasil (1964-1985) atingiu seu período de maior repressão, censura e perda de direitos civis com a decretação do:",["Ato Institucional nº 1 (AI-1)","Ato Institucional nº 5 (AI-5)","Plano Cohen","Constituição de 1988","Pacto de Varsóvia"],1,"Promulgado em 1968 no governo Costa e Silva, o AI-5 fechou o Congresso e suspendeu o habeas corpus para crimes políticos."],
  ["his",1,"Em 1989, a queda de qual estrutura simbolizou fisicamente o fim da Guerra Fria?",["O Muro de Berlim","O Kremlin","A Torre Eiffel","A Estátua da Liberdade","A Muralha da China"],0,"O Muro dividia a Alemanha Oriental (socialista) e a Ocidental (capitalista). Sua queda marcou o colapso do bloco comunista no leste europeu."],
  ["his",1,"Na Baixa Idade Média, a união de mercadores para proteger os seus negócios e definir preços locais chamava-se:",["Corporações de Ofício ou Guildas","Falanstérios","Cartéis oligopolistas","Sindicatos operários","Hansas mercenárias"],0,"As Corporações de Ofício (artesãos) e as Guildas (mercadores) garantiam monopólio, regulavam a qualidade e o preço nos burgos (cidades medievais)."],
  ["his",1,"O movimento modernista no Brasil, que rompeu com as regras artísticas clássicas europeias em favor de uma cultura nacional inovadora, teve seu marco inicial na:",["Semana de Arte Moderna (1922)","Revolta da Vacina (1904)","Inconfidência Mineira (1789)","Bossa Nova (1958)","Tropicalismo (1967)"],0,"Ocorreu no Teatro Municipal de São Paulo, liderada por artistas como Tarsila do Amaral (posteriormente), Anita Malfatti, Mário e Oswald de Andrade."],
  ["his",1,"Qual foi o principal motivo alegado para o início das revoltas tenentistas na década de 1920 no Brasil (como os 18 do Forte de Copacabana)?",["O fim da escravidão.","O aumento do preço do café.","A insatisfação de jovens militares com as fraudes eleitorais e o domínio das oligarquias.","O desejo de voltar à monarquia.","O apoio ao fascismo italiano."],2,"O Movimento Tenentista exigia voto secreto, moralização política e ensino público, combatendo a República Velha."],
  ["his",1,"A civilização mesopotâmica (Sumérios, Babilônicos) desenvolveu-se na região do Crescente Fértil, entre os rios:",["Tigre e Eufrates","Nilo e Jordão","Ganges e Indo","Amarelo e Azul","Tibre e Reno"],0,"Mesopotâmia significa 'terra entre rios'. Hoje a região fica no atual Iraque e arredores."],

  ["his",2,"O Absolutismo Monárquico, sistema do Antigo Regime Europeu, teve no rei francês Luís XIV seu maior símbolo ('O Estado sou eu'). Qual pensador formulou a tese de que 'o homem é o lobo do homem' e justificou o poder absoluto no livro 'Leviatã'?",["John Locke","Thomas Hobbes","Jacques Bossuet","Maquiavel","Rousseau"],1,"Hobbes argumentava que, para evitar a guerra civil de todos contra todos, o povo precisava ceder sua liberdade a um monarca de poder absoluto (o Leviatã)."],
  ["his",2,"Na Era Napoleônica (1806), foi decretado o Bloqueio Continental. O que ele visava e como afetou o Brasil?",["Proibir o comércio com a Rússia; não afetou o Brasil.","Proibir a Europa de comercializar com a Inglaterra; forçou a fuga da Família Real Portuguesa para o Brasil (1808).","Impedir a navegação nas Américas; abriu os portos aos navios franceses.","Aislar a França; causou o embargo do algodão brasileiro.","Fechar o Mar Mediterrâneo; forçou o Brasil a comercializar com os holandeses."],1,"D. João VI, aliado histórico da Inglaterra, não cumpriu o bloqueio. Com a ameaça de invasão francesa, fugiu para a colônia (Brasil)."],
  ["his",2,"Durante a Revolução Francesa, o período do 'Terror' (1793-1794) foi marcado pela guilhotina e pelo comando radical dos:",["Girondinos, liderados por Danton.","Jacobinos, liderados por Robespierre.","Monarquistas constitucionais, liderados por Luís XVI.","Burgueses ricos do Diretório.","Militares bonapartistas."],1,"Os Jacobinos, apoiados pelos sans-culottes, instituíram um governo de emergência violento que decapitou milhares de opositores (e até aliados)."],
  ["his",2,"No Brasil Império, a Revolução Praieira (1848), ocorrida em Pernambuco, foi o último grande movimento rebelde do período monárquico. Suas propostas tinham viés:",["Conservador e escravocrata, a favor de D. Pedro II.","Liberal e utópico (socialismo utópico), exigindo voto livre, fim do monopólio português no comércio e liberdade de imprensa.","Comunista soviético, visando fechar o comércio exterior.","Monarquista absolutista, querendo o retorno de D. Pedro I.","Separatista, visando entregar o Nordeste à França."],1,"Inspirados nas revoluções de 1848 na Europa (Primavera dos Povos), os praieiros tinham demandas liberais e radicais para a época."],
  ["his",2,"O 'New Deal', programa implementado por Franklin D. Roosevelt para salvar os EUA da Grande Depressão de 1929, fundamentou-se nas ideias do economista Keynes. Qual era o seu eixo central?",["Laissez-faire total: o mercado se ajusta sozinho sem o Estado.","Intervenção maciça do Estado na economia, através de obras públicas e seguro-desemprego, para gerar empregos e reativar o consumo.","Nacionalização completa de todos os bancos e indústrias para formar um sistema comunista.","Criação de campos de trabalho forçado em áreas rurais.","Emissão exclusiva de ouro como moeda."],1,"Rompeu com o liberalismo clássico, promovendo o Estado de Bem-Estar Social (Welfare State) para aquecer a demanda."],
  ["his",2,"Durante a Guerra do Paraguai (1864-1870), contra Solano López, o Brasil uniu-se a quais países formando a Tríplice Aliança?",["Argentina e Bolívia","Uruguai e Chile","Argentina e Uruguai","Chile e Peru","Argentina e Inglaterra"],2,"A guerra mais sangrenta da América do Sul uniu Brasil, Argentina e Uruguai contra o Paraguai, devastando a população masculina paraguaia."],
  ["his",2,"A Constituição de 1824, a primeira do Brasil, outorgada (imposta) por D. Pedro I, possuía uma singularidade em relação às democracias modernas. Tratava-se da existência do:",["Poder Tripartite (Executivo, Legislativo e Judiciário).","Voto universal secreto, que só existia no Brasil.","Poder Moderador, exclusivo do Imperador, que lhe dava a palavra final sobre os outros três poderes.","Parlamentarismo Republicano imposto pelo Conselho de Estado.","Direito de greve constitucional."],2,"O Poder Moderador garantia o absolutismo disfarçado de D. Pedro I, pois ele podia dissolver a câmara, vetar leis e nomear ministros."],
  ["his",2,"Na Grécia Antiga, o 'Período Helenístico' (iniciado com Alexandre, o Grande) caracterizou-se pela:",["Expulsão dos macedônios da Grécia.","Consolidação isolada da cultura grega, sem contato com o Oriente.","Fusão da cultura grega (helênica) com as culturas orientais (persa, egípcia), devido às imensas conquistas territoriais.","Criação do império ateniense no Mediterrâneo Ocidental.","Idade das Trevas grega, sem registros escritos ou artísticos."],2,"A expansão de Alexandre levou a cultura grega até a Índia e o Egito, criando um sincretismo cultural profundo."],
  ["his",2,"O Tratado de Versalhes (1919) pós-Primeira Guerra Mundial impôs duras penalidades à Alemanha, o que contribuiu para:",["A ascensão do comunismo e a fundação da URSS na Alemanha.","Um forte ressentimento nacionalista que pavimentou o caminho para a ascensão do Partido Nazista e a 2ª Guerra Mundial.","A aliança eterna entre a Alemanha e a França no século XX.","O enriquecimento imediato do país com a devolução de suas colônias africanas.","O início imediato da Guerra Fria."],1,"As pesadas indenizações e desmilitarizações arruinaram a economia alemã, terreno fértil para discursos extremistas (Hitler)."],
  ["his",2,"A Revolução de 1930 no Brasil marcou o fim da República Velha e o início da Era Vargas. Qual foi o evento pontual (estopim) que desencadeou o levante armado?",["O atentado ao Presidente Washington Luís.","O assassinato de João Pessoa (candidato a vice na chapa de Getúlio Vargas).","A descoberta de petróleo em Monteiro Lobato.","A Intentona Comunista liderada por Luís Carlos Prestes.","O bombardeio de São Paulo pelo governo federal."],1,"O assassinato (embora por motivos passionais/locais na Paraíba) foi usado politicamente pela Aliança Liberal para justificar o golpe militar de 1930."],
  ["his",2,"Na transição do Feudalismo para o Capitalismo, o 'Mercantilismo' foi a prática econômica dos reis absolutistas. Uma de suas principais características era a:",["Balança comercial favorável, protecionismo e metalismo (acumulação de ouro/prata).","Mínima interferência do Estado na economia (Livre concorrência).","Abolição total das tarifas alfandegárias para promover a paz.","Privatização das colônias em favor de comerciantes árabes.","Produção em massa utilizando maquinário a vapor (Revolução Industrial)."],0,"O Mercantilismo visava enriquecer o Estado Nacional através do pacto colonial e do acúmulo de metais preciosos."],
  ["his",2,"A Revolta da Vacina (1904), no Rio de Janeiro (então capital federal), teve como pano de fundo além da própria obrigatoriedade da vacina:",["A insatisfação com as reformas urbanas (o 'Bota-Abaixo' de Pereira Passos) que expulsaram os pobres do centro para os morros.","O protesto contra o fim da escravidão que havia ocorrido há poucos anos.","O medo da população de ser recrutada para a Guerra de Canudos.","Um levante monarquista organizado por D. Pedro II a partir do exílio.","Uma greve geral dos operários por jornada de oito horas."],0,"A obrigatoriedade violenta da vacina contra varíola imposta por Oswaldo Cruz foi a gota d'água de uma população já oprimida pelas reformas urbanas (surgimento das favelas)."],
  ["his",2,"A 'Lei de Terras' (Homestead Act) de 1862 nos Estados Unidos diferiu diametralmente da Lei de Terras brasileira de 1850 porque:",["Doeu grandes extensões apenas para donos de escravos do sul.","Incentivou a distribuição gratuita de terras no Oeste para colonos que as cultivassem por 5 anos, democratizando o acesso.","Proibiu a imigração europeia para não lotar as fazendas americanas.","Fechou as fronteiras no oeste para proteger os territórios indígenas intactos.","Transferiu todas as terras produtivas para o Estado, criando comunas agrícolas."],1,"Enquanto no Brasil a lei restringiu a terra a quem tinha muito dinheiro (elite), nos EUA ela estimulou pequenos proprietários rurais (farmers) a povoar o Oeste."],
  ["his",2,"O 'Renascimento Comercial e Urbano' na Baixa Idade Média esteve diretamente ligado ao movimento das:",["Guerras Púnicas, que abriram o Mediterrâneo aos romanos.","Cruzadas, que reabriram as rotas comerciais do Mediterrâneo entre o Oriente e o Ocidente, impulsionando os burgos.","Revoltas camponesas, que destruíram todos os castelos.","Invasões Bárbaras, que forçaram o comércio a se refugiar nas cidades fortificadas.","Grandes Navegações para a América, lideradas pelos vikings."],1,"As Cruzadas falharam religiosamente, mas reataram laços comerciais duradouros, trazendo produtos luxuosos do Oriente para a Europa via península itálica (Gênova e Veneza)."],
  ["his",2,"A Revolução Constitucionalista de 1932 foi um conflito armado em que os paulistas exigiam de Getúlio Vargas:",["A divisão do estado de São Paulo em duas repúblicas independentes.","O retorno imediato de Washington Luís ao poder.","A decretação de um estado socialista com Luís Carlos Prestes.","A elaboração de uma nova Constituição e a saída do interventor federal militar não paulista.","A reabertura dos portos para o tráfico de escravos africanos."],3,"Após 2 anos no poder provisoriamente, Vargas governava por decretos. A oligarquia paulista e a classe média se uniram para exigir a reconstitucionalização do Brasil."],
  ["his",2,"No contexto da Antiguidade Oriental, os Hebreus notabilizaram-se historicamente por um legado cultural distinto, que foi o:",["Desenvolvimento do alfabeto fonético (comercial) e da navegação avançada, como os fenícios.","Criarem o primeiro grande império militar da história da Mesopotâmia.","Politeísmo focado na deificação dos rios e do imperador.","O Monoteísmo ético (crença em um único Deus), fundando as bases do Judaísmo, Cristianismo e Islamismo.","Construção das pirâmides e invenção da escrita cuneiforme."],3,"Ao contrário da maioria dos povos da época (politeístas), os hebreus cultuavam apenas a Iavé/Jeová, revolucionando a história religiosa."],
  ["his",2,"Em 1962, o mundo chegou mais perto de um holocausto nuclear devido a um evento marcante da Guerra Fria conhecido como:",["Construção do Muro de Berlim.","A Invasão da Baía dos Porcos.","Guerra do Golfo e Operação Tempestade no Deserto.","Crise dos Mísseis em Cuba.","Lançamento do Sputnik (corrida espacial)."],3,"A URSS instalou secretamente mísseis nucleares em Cuba (a 140km da Flórida). Foram 13 dias de negociações tensas entre Kennedy e Kruschev até a retirada."],
  ["his",2,"A 'Revolta da Chibata' (1910) no Brasil foi liderada pelo marinheiro João Cândido. A principal reivindicação dos marinheiros era:",["Um aumento de soldo para os oficiais de alta patente.","O direito de votar nas eleições presidenciais.","O fim dos castigos físicos (chibatadas) e as péssimas condições de trabalho e alimentação nos navios da Marinha.","A implantação de uma república socialista no país.","O perdão das dívidas dos cafeicultores da Marinha."],2,"Os marinheiros (em sua imensa maioria negros e mulatos) sofriam com a disciplina brutal, semelhante à escravidão, recém-abolida há apenas 22 anos."],
  ["his",2,"A Conferência de Bandung (1955), na Indonésia, reuniu nações asiáticas e africanas recém-independentes visando:",["Declarar guerra imediatamente à Europa e EUA em conjunto.","Formar um pacto nuclear alinhado à União Soviética (Pacto de Varsóvia do Sul).","Fomentar o Movimento dos Países Não-Alinhados e repudiar o neocolonialismo, negando submissão à Guerra Fria bipolar.","Assinar a rendição formal das colônias perante o Império Japonês.","Solicitar o retorno do domínio britânico para pacificar a região."],2,"Eles cunharam a ideia de 'Terceiro Mundo': não alinhados nem ao capitalismo dos EUA (1º) nem ao socialismo da URSS (2º), buscando neutralidade e desenvolvimento."],
  ["his",2,"A Magna Carta (1215), assinada pelo rei João Sem Terra na Inglaterra, é um marco histórico porque:",["Criou a primeira constituição socialista do mundo ocidental.","Expulsou definitivamente a Igreja Católica do país, fundando a Igreja Anglicana.","Foi o primeiro documento a limitar os poderes do rei absolutista, sujeitando-o às leis e à aprovação dos nobres para criar impostos.","Concedeu liberdade total aos camponeses (fim da servidão feudal).","Marcou o fim do Império Romano do Ocidente pelas mãos dos saxões."],2,"A Magna Carta é a base histórica do constitucionalismo e das monarquias parlamentaristas (O rei reina, mas não governa absolutamente)."],
  ["his",2,"No processo de independência do Brasil, D. João VI retorna a Portugal em 1821 forçado pela:",["Invasão napoleônica de Portugal que durava até aquele ano.","Revolução Liberal do Porto (1820), que exigia seu retorno e a subordinação (recolonização) do Brasil às cortes portuguesas.","Pressão da Inglaterra para acabar com a escravidão imediatamente na colônia.","Declaração de Guerra por parte da Espanha contra as colônias ibéricas.","Revolta da Armada no Rio de Janeiro."],1,"A burguesia do Porto fez uma revolução exigindo uma constituição e o retorno do rei, o que precipitou o processo de emancipação conduzido por D. Pedro I que ficou."],
  ["his",2,"A Doutrina Truman (1947), aliada ao Plano Marshall, teve como objetivo geopolítico central:",["Destruir financeiramente a Alemanha permanentemente para evitar novas guerras.","Isolar a América Latina das interferências britânicas.","Conter a expansão da influência soviética/comunista no mundo através de ajuda econômica massiva e apoio militar aos países devastados pela guerra (Contenção).","Devolver a independência às nações africanas colonizadas pela Inglaterra.","Compartilhar a tecnologia da bomba atômica com as Nações Unidas."],2,"O 'Plano Marshall' foi a vertente econômica (dinheiro para reconstrução europeia) da estratégia de contenção do comunismo (Doutrina Truman)."],
  ["his",2,"Na sociedade Inca (Pré-Colombiana), a 'Mita' era um sistema que consistia em:",["Um mercado livre baseados em moedas de prata.","Uma forma de sacrifício humano obrigatório anualmente para o deus Sol.","Um sistema de trabalho compulsório (obrigatório e rotativo) prestado pelos camponeses ao Estado (para obras públicas e minas).","Um jogo de bola cerimonial comum a todas as tribos conquistadas.","A distribuição igualitária e democrática de terras entre os cidadãos."],2,"Foi tão eficiente que, posteriormente, os colonizadores espanhóis adaptaram a Mita para explorar o trabalho indígena nas minas de prata de Potosí (Bolívia)."],
  ["his",2,"Na República Oligárquica, o Convênio de Taubaté (1906) foi um acordo criado para:",["Financiar a industrialização de São Paulo com impostos da importação.","Garantir a compra dos excedentes de café pelos governos estaduais, evitando a queda dos preços do produto por superprodução, transferindo o prejuízo ao Estado.","Tabelar o preço da carne e do charque produzido no Sul do Brasil.","Incentivar a vinda de imigrantes europeus gratuitos para a lavoura canavieira.","Declarar guerra à Bolívia pelo território do Acre."],1,"Para salvar os cafeicultores ricos da crise de superprodução, os governos tomaram empréstimos externos e compraram o café que sobrava para guardar ou queimar."],
  ["his",2,"A Revolução de Avis (1383-1385) em Portugal foi fundamental para a história mundial subsequente porque:",["Garantiu a anexação de Portugal pela Espanha por mais de 200 anos (União Ibérica imediata).","Criou uma monarquia absolutista fragmentada controlada pelo Papa.","Marcou a aliança entre a nova Dinastia de Avis e a burguesia mercantil, criando o Estado Moderno pioneiro que financiaria a Expansão Marítima.","Destruiu completamente a frota naval lusa numa guerra civil sangrenta contra a Inglaterra.","Transformou Portugal numa república governada por um colégio de almirantes."],2,"A vitória de D. João I (Mestre de Avis) com forte apoio da burguesia e do povo garantiu a estabilidade e os recursos para o pioneirismo de Portugal nas Grandes Navegações."],

  ["bio",0,"Qual é a unidade básica, estrutural e funcional de todos os seres vivos?",["Órgão","Tecido","Célula","Molécula","Átomo"],2,"A célula é a menor unidade viva que compõe os organismos (Teoria Celular)."],
  ["bio",0,"O pigmento verde responsável por captar a luz solar nas plantas chama-se:",["Melanina","Clorofila","Caroteno","Hemoglobina","Xantofila"],1,"A clorofila está presente nos cloroplastos e é fundamental para a fotossíntese."],
  ["bio",0,"Os animais que não possuem coluna vertebral são classificados como:",["Mamíferos","Vertebrados","Invertebrados","Anfíbios","Répteis"],2,"Invertebrados (como insetos, moluscos e vermes) não possuem crânio nem coluna vertebral."],
  ["bio",0,"Qual o gás que os seres humanos absorvem na inspiração e utilizam na respiração celular?",["Gás Carbônico (CO₂)","Gás Oxigênio (O₂)","Nitrogênio (N₂)","Hélio (He)","Monóxido de Carbono (CO)"],1,"O oxigênio é essencial para a produção de energia nas células animais e vegetais."],
  ["bio",0,"A dengue, zika e chikungunya são doenças transmitidas pela picada de qual mosquito?",["Anopheles","Culex","Aedes aegypti","Palha","Barbeiro"],2,"O Aedes aegypti é o vetor destas viroses e prolifera-se em água parada."],
  ["bio",0,"O conjunto de todos os ecossistemas do planeta Terra recebe o nome de:",["Atmosfera","Litosfera","Biosfera","Hidrosfera","Estratosfera"],2,"A biosfera é a esfera da vida, abrangendo todas as regiões do planeta onde existem seres vivos."],
  ["bio",0,"As vacinas têm como principal objetivo:",["Curar doenças bacterianas.","Aliviar sintomas de viroses.","Estimular o corpo a produzir anticorpos (prevenção).","Fornecer anticorpos prontos.","Combater fungos na pele."],2,"A vacina contém antígenos inativos que ensinam o sistema imunitário a defender-se (imunização ativa)."],
  ["bio",0,"Na cadeia alimentar, os organismos que produzem o seu próprio alimento (como as plantas) são chamados de:",["Consumidores primários","Decompositores","Consumidores secundários","Produtores","Herbívoros"],3,"Os produtores, através da fotossíntese, são a base de qualquer cadeia alimentar."],
  ["bio",0,"O órgão do corpo humano responsável por bombear o sangue para todas as partes do corpo é o:",["Pulmão","Fígado","Coração","Cérebro","Rim"],2,"O coração é um órgão muscular que funciona como uma bomba dupla no sistema circulatório."],
  ["bio",0,"Qual destas doenças é causada por um vírus?",["Tuberculose","Gripe","Cólera","Sífilis","Tétano"],1,"A gripe é causada pelo vírus Influenza. As restantes opções são doenças bacterianas."],
  ["bio",0,"Os seres vivos que se alimentam exclusivamente de carne são chamados:",["Herbívoros","Onívoros","Carnívoros","Decompositores","Produtores"],2,"Carnívoros ocupam os níveis tróficos de consumidores secundários em diante."],
  ["bio",0,"Qual é a principal função dos rins no corpo humano?",["Digerir proteínas.","Bombear o sangue.","Filtrar o sangue e produzir a urina.","Produzir hormonas sexuais.","Armazenar fezes."],2,"Os rins filtram as impurezas do sangue, excretando-as sob a forma de urina."],
  ["bio",0,"A molécula que carrega as nossas informações genéticas (hereditárias) é o:",["RNA","ATP","Proteína","DNA","Glicose"],3,"O Ácido Desoxirribonucleico (DNA) contém os genes que determinam as nossas características."],
  ["bio",0,"Os cogumelos e bolores pertencem a que reino da natureza?",["Animal","Vegetal","Fungi","Monera","Protista"],2,"Eles são fungos (Reino Fungi), organismos eucariontes e heterotróficos."],
  ["bio",0,"O processo pelo qual uma lagarta se transforma numa borboleta é chamado de:",["Mutaçâo","Metamorfose","Clonagem","Fotossíntese","Fecundação"],1,"A metamorfose é a mudança drástica na forma do corpo durante o desenvolvimento de certos animais."],
  ["bio",0,"Quais são os vasos sanguíneos que levam o sangue do coração para o resto do corpo?",["Veias","Artérias","Capilares","Vênulas","Gânglios"],1,"As artérias suportam alta pressão e conduzem o sangue que sai dos ventrículos do coração."],
  ["bio",0,"O desenvolvimento sustentável é aquele que:",["Destrói os recursos para o lucro rápido.","Impede qualquer tipo de construção.","Atende às necessidades do presente sem comprometer as gerações futuras.","Foca apenas no plantio de árvores no deserto.","Acaba com a economia para salvar os animais."],2,"É o equilíbrio entre desenvolvimento económico, social e preservação ambiental."],
  ["bio",0,"Os ossos e músculos trabalham juntos para permitir o movimento. Eles formam o sistema:",["Digestório","Respiratório","Nervoso","Locomotor","Excretor"],3,"O sistema locomotor (ou musculoesquelético) dá sustentação e mobilidade ao corpo."],
  ["bio",0,"A mistura de saliva com o alimento na boca forma o:",["Quimo","Quilo","Bolo alimentar","Suco gástrico","Bile"],2,"A mastigação e insalivação transformam o alimento no bolo alimentar, pronto a ser engolido."],
  ["bio",0,"Animais como cães, gatos e seres humanos, cujas crias se desenvolvem dentro do útero materno, são:",["Ovíparos","Ovovivíparos","Vivíparos","Marsupiais","Anfíbios"],2,"Vivíparos são os animais cujo embrião se desenvolve no interior do corpo da mãe."],
  ["bio",0,"A falta de vitamina C no organismo causa uma doença conhecida como:",["Raquitismo","Escorbuto","Anemia","Cegueira noturna","Bócio"],1,"O escorbuto era comum nos marinheiros antigos devido à falta de frutas cítricas frescas (vitamina C)."],
  ["bio",0,"Para que servem os estômatos nas folhas das plantas?",["Para absorver água da chuva.","Para realizar as trocas gasosas (transpiração e respiração).","Para armazenar glicose.","Para fixar a planta no solo.","Para atrair insetos."],1,"Pequenos poros que abrem e fecham permitindo a entrada de CO₂ e saída de O₂ e vapor de água."],
  ["bio",0,"O que caracteriza um animal de 'sangue quente' (homeotérmico)?",["Sua temperatura corporal varia conforme o ambiente.","Ele precisa ficar no sol para se aquecer.","Sua temperatura corporal mantém-se constante, gerando calor interno.","Seu sangue ferve no verão.","Eles hibernam o ano todo."],2,"Aves e mamíferos mantêm a temperatura interna estável independentemente do clima exterior."],
  ["bio",0,"Qual célula do sangue é responsável pela defesa do nosso organismo contra infeções?",["Glóbulos vermelhos (hemácias)","Plaquetas","Glóbulos brancos (leucócitos)","Plasma","Neurónios"],2,"Os leucócitos são as células de defesa que englobam ou destroem agentes patogénicos."],
  ["bio",0,"O uso excessivo e incorreto de antibióticos pode causar:",["A morte imediata do paciente.","A criação de vírus mais fortes.","A seleção de bactérias super-resistentes.","O desenvolvimento de alergias eternas.","A cura mais rápida da gripe."],2,"Sobrevivem as bactérias que possuem mutações resistentes, que depois se multiplicam sem concorrência."],

  ["bio",1,"Em que organelo celular ocorre a síntese de proteínas?",["Mitocôndria","Complexo de Golgi","Lisossoma","Ribossoma","Retículo Endoplasmático Liso"],3,"Os ribossomas (livres ou aderidos ao retículo rugoso) traduzem o RNAm em cadeias de proteínas."],
  ["bio",1,"Qual é a diferença básica entre células procariontes e eucariontes?",["Procariontes têm núcleo delimitado por membrana (carioteca), eucariontes não.","Procariontes não possuem material genético.","Eucariontes têm núcleo organizado (carioteca), procariontes têm o DNA solto no citoplasma.","Procariontes são sempre pluricelulares.","Eucariontes não possuem mitocôndrias."],2,"Bactérias são procariontes; o seu material genético fica no citoplasma (nucleoide)."],
  ["bio",1,"Se um homem do grupo sanguíneo AB tiver filhos com uma mulher do grupo O, os possíveis grupos sanguíneos dos filhos são:",["Apenas O","A e B","AB e O","A, B, AB e O","Apenas AB"],1,"AB envia o alelo IA ou IB. O envia apenas i. Os filhos serão IAi (Tipo A) ou IBi (Tipo B)."],
  ["bio",1,"A relação ecológica entre a anêmona-do-mar e o peixe-palhaço (ambos se beneficiam e podem viver separados) é chamada de:",["Comensalismo","Parasitismo","Protocooperação (Mutualismo facultativo)","Mutualismo obrigatório","Amensalismo"],2,"Ambos beneficiam (a anêmona protege o peixe, o peixe atrai presas para a anêmona), mas a relação não é vital/obrigatória."],
  ["bio",1,"Charles Darwin propôs que a evolução das espécies ocorre através da:",["Lei do uso e desuso.","Herança dos caracteres adquiridos.","Mutação radioativa.","Seleção Natural.","Geração espontânea."],3,"Os indivíduos mais adaptados ao ambiente têm maior probabilidade de sobreviver e reproduzir-se."],
  ["bio",1,"A doença de Chagas é causada pelo protozoário *Trypanosoma cruzi* e transmitida por qual inseto?",["Mosquito prego","Mosquito palha","Carrapato-estrela","Barbeiro (Triatomíneo)","Mosca tsé-tsé"],3,"O inseto barbeiro defeca após a picada e o próprio indivíduo coça, empurrando o parasita para a corrente sanguínea."],
  ["bio",1,"O processo de divisão celular que reduz pela metade o número de cromossomas, formando gametas (espermatozoides e óvulos), chama-se:",["Mitose","Meiose","Fissão binária","Brotamento","Clivagem"],1,"A meiose gera 4 células haploides (n), garantindo que a fecundação restaure a diploidia (2n)."],
  ["bio",1,"A organela responsável por 'empacotar', modificar e exportar substâncias produzidas na célula é o:",["Núcleo","Complexo de Golgi (Golgiense)","Peroxissoma","Lisossoma","Cloroplasto"],1,"O Complexo Golgiense atua como o 'correio' da célula, secretando substâncias."],
  ["bio",1,"Na espécie humana, o sexo biológico masculino é determinado por qual par de cromossomas sexuais?",["XX","YY","XY","XO","XXY"],2,"As fêmeas são XX e os machos são XY. O cromossoma Y determina o desenvolvimento masculino."],
  ["bio",1,"Lamarck foi um dos primeiros a teorizar sobre a evolução. Qual destas leis era central na sua teoria?",["Seleção natural.","Sobrevivência do mais apto.","Lei do Uso e Desuso.","Genética de populações.","Mutação aleatória."],2,"Ele acreditava que o uso constante de um órgão o desenvolvia, e o desuso o atrofiava (o que se provou errado como mecanismo evolutivo único)."],
  ["bio",1,"A eutrofização (eutroficação) de um lago é causada principalmente por:",["Excesso de pesca predatória.","Poluição por esgotos e fertilizantes ricos em fósforo e nitrogênio.","Chuva ácida intensa.","Aumento de peixes carnívoros.","Vazamento de petróleo bruto."],1,"O excesso de nutrientes causa a multiplicação descontrolada de algas que, ao morrerem, consomem o oxigênio da água, matando os peixes."],
  ["bio",1,"As orquídeas que vivem apoiadas em galhos de árvores altas para conseguir luz, sem prejudicar a árvore, fazem uma relação de:",["Parasitismo","Inquilinismo (Epifitismo)","Mutualismo","Predatismo","Competição"],1,"A orquídea obtém suporte físico (luz) sem roubar seiva da árvore hospedeira."],
  ["bio",1,"Ao pisar um prego enferrujado, uma pessoa deve tomar o soro antitetânico. A diferença entre soro e vacina é que o soro:",["Possui o vírus enfraquecido.","Gera imunidade duradoura para o resto da vida.","Possui anticorpos já prontos para ação imediata e curativa.","Ensina o corpo a criar suas próprias defesas.","É usado apenas para doenças genéticas."],2,"O soro é usado quando não há tempo para o corpo produzir os anticorpos sozinho."],
  ["bio",1,"O hormônio responsável por controlar os níveis de glicose (açúcar) no sangue, produzido no pâncreas, é a:",["Testosterona","Adrenalina","Tiroxina","Insulina","Melatonina"],3,"A insulina permite que a glicose entre nas células. A sua falta causa a diabetes mellitus."],
  ["bio",1,"A principal característica dos Artrópodes (insetos, aracnídeos, crustáceos) que os diferencia de outros invertebrados é:",["Possuírem concha calcária.","Terem corpo gelatinoso e urticante.","Possuírem exoesqueleto de quitina e apêndices (patas) articulados.","Respirarem por pulmões bem desenvolvidos.","Serem todos parasitas."],2,"A palavra artrópode significa 'pés articulados'. O exoesqueleto exige que eles façam 'mudas' (ecdises) para crescer."],
  ["bio",1,"O filo dos Cordados, ao qual pertencemos, tem como característica exclusiva na fase embrionária a presença de:",["Coluna vertebral ossea em todos os membros.","Notocorda, tubo nervoso dorsal e fendas faringianas.","Exoesqueleto de quitina.","Pele coberta por escamas.","Coração com quatro cavidades em todas as espécies."],1,"Embora nem todos desenvolvam coluna vertebral depois (ex: anfioxo), todos possuem notocorda quando embriões."],
  ["bio",1,"Durante a digestão, o local onde ocorre a maior absorção de nutrientes para a corrente sanguínea é:",["Estômago","Intestino Grosso","Fígado","Boca","Intestino Delgado"],4,"O intestino delgado é extremamente longo e possui microvilosidades que maximizam a área de absorção."],
  ["bio",1,"A associação entre fungos e algas (ou cianobactérias) que pode viver em rochas nuas e serve como bioindicador de poluição é chamada de:",["Líquen","Micorriza","Musgo","Samambaia","Coral"],0,"Os líquenes são uma relação de mutualismo obrigatório essencial na sucessão ecológica primária."],
  ["bio",1,"Qual parte do sistema nervoso central é responsável pelo equilíbrio e coordenação motora?",["Bulbo","Cérebro","Cerebelo","Medula espinhal","Hipotálamo"],2,"O cerebelo, localizado na parte posterior do crânio, coordena movimentos finos, postura e equilíbrio."],
  ["bio",1,"Na genética mendeliana, o cruzamento entre indivíduos heterozigotos (Aa × Aa) gera, fenotipicamente, a proporção esperada de:",["100% dominante","1 dominante : 1 recessivo","3 dominantes : 1 recessivo","1 dominante : 3 recessivos","2 dominantes : 2 recessivos"],2,"O quadrado de Punnett gera 1 AA, 2 Aa (3 com fenótipo dominante) e 1 aa (fenótipo recessivo)."],
  ["bio",1,"Uma teia alimentar difere de uma cadeia alimentar porque:",["A teia só tem produtores e decompositores.","A cadeia possui fluxos de energia em várias direções, cruzando-se.","A teia mostra o intercruzamento de várias cadeias alimentares num ecossistema.","A cadeia alimentar é sempre maior que a teia.","Na teia a energia aumenta a cada nível trófico."],2,"A teia é uma rede complexa, mais realista, onde um animal pode ocupar vários níveis tróficos ao mesmo tempo."],
  ["bio",1,"Bactérias, Archaea e Eukarya representam a classificação taxonômica moderna conhecida como:",["Reinos","Filos","Famílias","Domínios","Classes"],3,"Proposta por Carl Woese, o Domínio é a categoria taxonômica mais ampla, acima de Reino."],
  ["bio",1,"Os hormônios sexuais femininos responsáveis pelo ciclo menstrual e pelas características secundárias são:",["Testosterona e Adrenalina","Progesterona e Estrogênio","Insulina e Glucagon","Ocitocina e Prolactina","T3 e T4"],1,"Os ovários produzem estrogênio (características femininas) e progesterona (preparação do útero para gravidez)."],
  ["bio",1,"Nas plantas angiospermas, após a fecundação, o óvulo e o ovário desenvolvem-se, respectivamente, em:",["Caule e folha","Semente e fruto","Fruto e semente","Raiz e flor","Pólen e néctar"],1,"O óvulo abriga o embrião virando semente, enquanto as paredes do ovário engrossam formando o fruto."],
  ["bio",1,"A biomagnificação (ou magnificação trófica) de produtos tóxicos, como metais pesados, tem como consequência:",["A destruição imediata dos produtores.","A diluição do veneno ao longo da cadeia.","A maior concentração das toxinas nos consumidores do topo da cadeia alimentar.","O aumento da população de peixes.","A purificação natural da água."],2,"Substâncias não biodegradáveis acumulam-se nos tecidos e a sua concentração aumenta nos últimos níveis (ex: águias, humanos)."],
