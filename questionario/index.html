  ["fil",2,"Immanuel Kant propôs o 'Imperativo Categórico' na sua Filosofia Moral. A formulação principal dessa lei universal exige que você:",["Siga os Dez Mandamentos bíblicos literalmente sem questionar e obedeça ao Papa em Roma incondicionalmente no século dezoito e dezenove europeu cristão dogmático medieval de forma acrítica dogmática cega fielmente submissa e reverente na igreja aos domingos de manhã ensolarados de outono alemão austríaco pacífico sem guerras ou conflitos e heresias perseguidas pela inquisição cruel sombria espanhola antiga inquisitorial.","Age apenas segundo uma máxima (regra de ação) tal que possas ao mesmo tempo querer que ela se torne uma lei universal e válida para todos os seres humanos sem abrir exceções egoístas para você mesmo em momentos difíceis de sobrevivência crítica e pressão social forte e de amigos próximos que mentem com boas intenções mentirosas supostamente falsas enganosas úteis.","Faça as ações que gerarem as melhores consequências e lucros práticos, mesmo que precise mentir e roubar temporariamente para alcançar o seu sucesso acadêmico financeiro na vida real competitiva fria selvagem e egoísta focada apenas na sua família e no seu conforto burguês material luxuoso capitalista contemporâneo pós revolução russa e industrial da grã bretanha insular rainha de mares vastos de piratas bárbaros mercenários assalariados cruéis sanguinários terríveis piratas das caraíbas tropicais no verão de mil setecentos e vinte e dois da nossa era temporal civilizada moderna atual recente secular laica.","Tudo é relativo, então você não deve agir."],1,"Para Kant (Deontologia), não importam as consequências (finais), mas sim a intenção e o dever. Mentir é sempre errado, porque se todos mentissem, a verdade e a linguagem perderiam o sentido (a regra não seria universalizável)."],
  ["fil",2,"Friedrich Nietzsche decretou filosoficamente 'Deus está morto'. Num contexto profundo e não apenas religioso, isto simbolizou para o niilismo moderno:",["O assassinato literal de divindades mitológicas com espadas medievais gregas por cruzados loucos fanatizados num transe mágico celestial profano violento e sangrento.","O fim e a falência de todos os valores absolutos, éticas universais, verdades inquestionáveis (Platonismo/Cristianismo) e a chegada de um vazio existencial na cultura ocidental que forçaria a humanidade a criar novos valores por conta própria (o Übermensch - Além-do-Homem).","Um pedido de desculpas aos deuses politeístas romanos antigos.","A implantação do sistema socialista ateu soviético autoritário global de forma armada e cruel por soldados nas trincheiras e cidades escuras nevadas geladas no inverno rigoroso siberiano russo comunista extremista letal de gulags e campos de trabalho escravo opressivos para presos políticos tristes abandonados famintos e congelados.","A chegada do apocalipse zumbi na Alemanha ocidental moderna de forma trágica apoteótica divina mitológica grega.","Apenas um ódio sem sentido contra a Igreja."],1,"Nietzsche diagnosticou que o Homem havia parado de acreditar nas bases metafísicas da civilização (o valor moral supremo caiu), gerando um vazio. Era a hora de superar a 'moral de escravos' fraca e ser o mestre da própria vontade de potência."],
  ["fil",2,"Segundo o sociólogo italiano Antonio Gramsci, o poder da burguesia não se mantém apenas pela força bruta da polícia ou do exército, mas sim porque os dominados aceitam pacificamente as ideias da elite. Ele deu o nome a essa dominação cultural invisível de:",["Revolução Bolchevique da Ditadura do Proletariado Armada Invasora e Repressiva de Camponeses e Soldados e Marinheiros Rebeldes Insatisfeitos e Revoltados Cansados de Fome e Miséria Absoluta Extrema Pobreza Inevitável Mortal Maciça Decadente Fatal Terminal Suicida Revolucionária Atroz Sangrenta Cruel de Baionetas de Aço Inox.","Mais-valia Relativa e Absoluta Maquinofatureira Industrial de Manchester e Londres com Trabalho Infantil Escravo nas Minas de Carvão e Tecelagens Insalubres Barulhentas e Sujas de Fumo e Fuligem Negra Escura Tóxica e Letal e Criminosa Focada em Lucro Extremo Abusivo Opressor e Repressor Feudal Imperial Colonial Neocolonial Americano Africano Asiático Europeu Global e Mundial Ocidental.","Luta de Classes Anárquica Espontânea nas Ruas e Praças das Metrópoles Subdesenvolvidas Sem Sindicatos Sem Líderes Estudantis Populares de Esquerda ou Direita Sem Direção Focada em Saques e Roubos Oportunistas Ilegais Rebeldes e Hediondos Assassinos Cruéis e Máfias Ocultas.","Hegemonia Cultural, onde a elite domina as escolas, a mídia e a igreja, criando um 'consenso' e fazendo o povo pensar que o sistema desigual é normal e bom para todos eles, evitando assim que haja uma revolução armada violenta nas ruas e fábricas das capitais dos países desenvolvidos ocidentais burgueses ricos opulentos.","A Violência Simbólica Escolar da Escola de Chicago com Foucault e Bauman Franceses em Nova Iorque da Era do Jazz nos Loucos Anos Vinte de Ouro do Século Vinte de Bebidas Ilegais Contrabandeadas pela Máfia Italiana e Irlandesa em Carros de Fuga Rápidos Modernos e Cinema Mudo Preto e Branco a Cores Nostálgicas e Melancólicas e Vivas na Arte Deco."],3,"O conceito de Hegemonia revolucionou o marxismo, explicando por que os operários na Europa Ocidental não fizeram revoluções: eles estavam dominados culturalmente e mentalmente pela ideologia burguesa, não apenas fisicamente pela polícia de choque repressiva autoritária e brutal."],
  ["fil",2,"Na filosofia fenomenológica e existencial de Heidegger, ele usa o termo 'Dasein' (Ser-aí) para designar:",["Uma pedra ou árvore que apenas existe no espaço e no tempo de forma inerte e passiva sem consciência própria ou entendimento cósmico universal.","Apenas Deus.","O ente que compreende o seu próprio ser, ou seja, o ser humano que é atirado no mundo e tem consciência da sua própria morte inevitável (ser-para-a-morte), angustiando-se perante o nada existencial temporal temporalizado finita.","O modelo de governo nazista autoritário violento repressivo elitista racista puro branco ariano extremo da Alemanha do meio do século vinte catastrófico e belicista violador das nações em pactos secretos quebra de regras internacionais genocida bárbaro inumano abjeto frio metódico.","O espírito de um animal primitivo macaco ou cão doméstico de luxo que dorme e não sabe ler livros.","Um robô de IA."],2,"Heidegger recusa definir o Homem apenas como 'animal racional' (Aristóteles). O Dasein é existência crua, preocupação, tempo e projeto aberto, marcado pela finitude extrema trágica fatal inescapável da morte no fim da vida biológica humana de forma angustiante pesada poética livre existencial."],
  ["fil",2,"Em Aristóteles, qual é a diferença entre 'Ato' e 'Potência' (teoria fundamental da mudança física e metafísica da natureza clássica)?",["O 'Ato' é o teatro grego da tragédia de Édipo dramático e a 'Potência' é o exército de Esparta militar armado forte treinado violento belicoso.","'Ato' é a lei de Deus cristã do antigo testamento sagrada pura e 'Potência' é a força do diabo nas trevas medievais escuras hereges demoníacas diabólicas e perigosas fatais que matam pessoas de peste negra fatal terminal rápida cruel nojenta.","'Ato' é a ilusão de óptica e 'Potência' é o sol da caverna de Platão que queima os olhos de Sócrates.","'Ato' é como a coisa se manifesta e existe no agora real (uma árvore madura formada), e 'Potência' é a capacidade interna da coisa se transformar no futuro (uma semente tem a potência de ser árvore). Isso resolve o problema de Parmênides do movimento imutável da natureza cósmica.","Não há diferença."],3,"Aristóteles usou esta teoria para provar que o movimento existe e não é uma ilusão. O movimento é a atualização da potência de um corpo natural biológico vivo físico mecânico dinâmico orgânico animal vegetal estelar no universo geocêntrico ptolomaico grego natural fixo ordenado e belo divino e teleológico com propósito causal da causa final suprema divina do motor imóvel de forma perfeita lógica analítica e coerente sem vácuo espacial."],
  ["fil",2,"A Teoria do Agir Comunicativo do filósofo Jürgen Habermas (Escola de Frankfurt segunda geração) defende que a salvação das democracias e da sociedade moderna contra o controle opressivo dos governos e do mercado financeiro livre selvagem e violento depende essencialmente de:",["Uma guerra civil armada internacional global e atómica nuclear destrutiva anárquica niilista para começar do zero com os sobreviventes nas ruínas radioativas poluídas de mutantes zumbis cruéis irracionais sem leis soltos em florestas.","Instaurar uma ditadura intelectual onde apenas filósofos doutores com PHDs da universidade comandam os camponeses rudes sem instrução básica nenhuma analfabetos fracos sujos pobres famintos explorados submissos violentamente punidos por leis marciais extremas bárbaras medievais atrasadas opressoras e letais nas vilas isoladas nas montanhas frias suíças germânicas.","Substituir a política pelos robôs super inteligentes de inteligência artificial futurista espacial ciborgues sem sentimentos lógicos puros e invencíveis dominando a humanidade submissa numa teia cibernética utópica matrix perfeita controlada por cabos e luzes leds neon psicodélicas noturnas insones sem sol livre.","Uma ação focada no diálogo racional, livre de coerções e ameaças armadas, onde os cidadãos da 'Esfera Pública' debatem em igualdade para chegar a consensos justos, sendo a razão comunicativa e a linguagem os pilares e a cura da política moderna alienada pelo dinheiro sujo e pelo poder corporativo autoritário midiático fascista ou totalitário estúpido e corrupto no Brasil ou na Europa moderna laica e madura sociologicamente livre.","Retornar ao escambo e abandonar a internet e a leitura e os jornais independentes impressos e televisivos jornalísticos desportivos culinários locais para abraçar o silêncio religioso."],3,"Habermas acreditava que a linguagem tem um potencial ético de libertação. Se blindarmos a esfera pública (debates) contra o dinheiro (manipulação de media), a democracia sobrevive através da argumentação argumentada lógica racional respeitosa igualitária moral da maioria civil esclarecida."],
  ["fil",2,"Na Sociologia da Violência no Brasil Contemporâneo, o sociólogo Michel Misse descreve a 'Sujeição Criminal'. O que é isso num contexto de favelas e polícias e criminalidade urbana diária intensa e desigual?",["A lei federal que pune criminosos do colarinho branco que roubam milhões da corrupção partidária de empreiteiras na capital do país e são punidos na prisão perpétua em celas de luxo e sem regalias nenhuma nunca mais no sistema judicial perfeito e suíço limpo igualitário cego divino e incorruptível moderno exemplar honesto sem falhas ou atrasos criminais federais lentos demorados arrastados.","É o fato de que negros no Brasil nascem com o gene da criminalidade italiana da máfia dos anos vinte de Al Capone provada biologicamente pelo lombrosianismo racista fascista europeu descartado do século dezenove colonialista escravista determinista médico anatômico craniométrico falso mentiroso nojento e ultrapassado cruel.","A criação de escolas apenas para filhos de criminosos ensinarem novos crimes matemáticos cibernéticos hackers russos e americanos da dark web profunda inacessível perigosa anónima com bitcoins virtuais de forma legalizada e financiada pelo tesouro direto nacional.","É o processo social onde certos perfis e pessoas (geralmente jovens, negros e periféricos favelados pobres descamisados) não apenas cometem crimes, mas a própria sociedade os 'criminaliza' como sujeitos monstruosos irrecuperáveis e perigosos que merecem morrer na bala da polícia sem direito de defesa num tribunal civil (encarnam a identidade bandida inata que a classe média e a TV punitiva exigem eliminar fisicamente como lixo humano sujo).","O tráfico internacional e o contrabando de pedras preciosas."],3,"Este conceito alerta que o problema da segurança no Brasil não é só o crime isolado em si. É o processo de incriminação preventiva em que o indivíduo passa a ser visto socialmente como irrecuperável e descartável."],
  ["fil",2,"Hannah Arendt, ao cobrir o julgamento do nazista Adolf Eichmann em Jerusalém, cunhou o conceito de 'Banalidade do Mal'. Esse conceito expressa que:",["O mal é exercido unicamente por monstros sádicos e psicopatas que sentem prazer direto na dor e na tortura alheia.","Grandes atrocidades históricas podem ser cometidas por burocratas comuns que renunciam à capacidade de pensar criticamente e apenas cumprem ordens com zelo técnico.","O mal é uma força biológica inata presente de forma irreversível em certas etnias humanas.","A ausência de crença religiosa é a causa fundamental de todas as guerras e massacres modernos.","O totalitarismo é uma ilusão jurídica inventada pelas potências vencedoras da Segunda Guerra Mundial."],1,"Arendt percebeu que Eichmann não era um demônio sádico, mas um funcionário medíocre e incapaz de pensar a partir do ponto de vista do outro, limitando-se a cumprir ordens cegamente."],
  ["fil",2,"O filósofo camaronês Achille Mbembe formulou o conceito de 'Necropolítica'. De acordo com essa teoria, a expressão máxima da soberania moderna reside em:",["Garantir a assistência em saúde e o bem-estar universal para toda a população sem distinções raciais.","O poder do Estado de ditar quem pode viver e quem deve morrer, elegendo grupos específicos como alvos preferenciais de destruição física.","Substituir os exércitos humanos por armamentos nucleares e drones inteligentes nas fronteiras.","Promover a igualdade salarial plena e erradicar o racismo estrutural nas ex-colônias africanas.","Estabelecer a diplomacia pacífica entre o Norte e o Sul global sob a mediação da ONU."],1,"A necropolítica investiga como o Estado define populações descartáveis ou inimigas prioritárias (frequentemente periféricas e racializadas), gerenciando a própria morte como ferramenta de poder."],
  ["fil",2,"Em 'A Sociedade do Cansaço', o filósofo sul-coreano Byung-Chul Han argumenta que a sociedade do século XXI transicionou do paradigma disciplinar (Foucault) para a:",["Sociedade teocrática absolutista guiada pelo medo de punições divinas e da Inquisição.","Sociedade do desempenho, onde o próprio indivíduo se torna o seu próprio algoz e explorador em busca da auto-otimização contínua.","Sociedade comunista pura com eliminação total das jornadas de trabalho e do cansaço crônico.","Sociedade agrária de subsistência focada na harmonia com o tempo biológico da natureza.","Sociedade tribal isolada e desconectada das tecnologias e dos algoritmos digitais."],1,"Han explica que o sujeito moderno não é mais reprimido por um vigia externo, mas pela cobrança interna de produtividade perpétua, culminando em esgotamento crônico (burnout e depressão)."],
  ["fil",2,"O conceito de 'Fato Social Total', formulado pelo antropólogo Marcel Mauss em seu clássico 'Ensaio sobre a Dádiva', estabelece que certos fenômenos:",["Devem ser explicados puramente por equações matemáticas e pelo modelo econométrico clássico.","Mobilizam simultaneamente múltiplas dimensões da vida coletiva, como a religião, o direito, a moral, a economia e o parentesco.","São universais e imutáveis, dependendo exclusivamente dos instintos biológicos dos hominídeos primitivos.","Ocorrem unicamente nas bolsas de valores modernas e nos mercados financeiros de capitais.","Tratam da submissão cega e involuntária do proletariado aos generais durante períodos de guerra."],1,"Para Mauss, a troca de presentes nas sociedades tradicionais (dar, receber e retribuir) não é uma ação econômica isolada, mas um fato social que engloba política, parentesco, direito e espiritualidade."],
  ["fil",2,"Ao analisar o nascimento do capitalismo industrial, Max Weber relacionou o seu avanço com a 'Ética Protestante', demonstrando que a vertente calvinista favoreceu esse processo ao:",["Condenar qualquer tipo de trabalho manual e recomendar a contemplação mística e o isolamento feudal.","Interpretar o sucesso econômico advindo do trabalho árduo, metódico e austero (sem ostentação) como sinal do favor e eleição divina.","Defender a distribuição obrigatória e imediata de todos os lucros obtidos aos camponeses desfavorecidos.","Instituir a queima pública de títulos bancários e a proibição absoluta de empréstimos com juros.","Determinar que o Papa exercia controle direto sobre os tesouros e os investimentos produtivos de cada fiel."],1,"A doutrina da predestinação calvinista gerou uma angústia religiosa aplacada pela dedicação incansável à profissão e pelo reinvestimento contínuo da riqueza (ascese intramundana)."],
  ["fil",2,"O conceito de 'Biopoder', cunhado por Michel Foucault, refere-se ao conjunto de técnicas de governo que emergem no século XVIII para gerir:",["O extermínio ritualístico de heréticos em praça pública ordenado diretamente pelo soberano monárquico.","A vida biológica da população em grande escala, por meio de estatísticas de natalidade, controle de epidemias, demografia e saúde pública.","O comércio internacional marítimo de escravizados sob o monopólio mercantilista espanhol e português.","A expansão da fé cristã em territórios ultramarinos através das ordens religiosas jesuíticas.","O julgamento marcial exclusivo de desertores e traidores do exército durante batalhas fronteiriças."],1,"Enquanto a soberania clássica impunha o direito de 'fazer morrer ou deixar viver', o biopoder opera na lógica inversa de 'fazer viver e deixar morrer', regulando os processos vitais da população."],
  ["fil",2,"Gilles Deleuze, ao atualizar as teses de Foucault sobre as disciplinas, teorizou a transição das 'sociedades disciplinares' (de confinamento) para as:",["Sociedades medievais corporativas, fixadas no feudo e na lealdade aos suseranos e guildas.","Sociedades de controle, onde a vigilância é contínua, desterritorializada e operada por modulações numéricas, senhas e fluxos de dados.","Sociedades anarquistas comunitárias livres de qualquer mediação técnica ou burocrática estatal.","Sociedades escravagistas de plantation agroexportadora voltadas ao fornecimento de commodities agrícolas.","Sociedades nômades de caçadores-coletores sem divisão social do trabalho ou acumulação monetária."],1,"Nas sociedades de controle, o indivíduo não transita mais de um espaço fechado para outro (escola, quartel, fábrica), mas vive sob controle flexível ininterrupto (teletrabalho, cartões, métricas e redes)."],
  ["fil",2,"No livro 'Crítica da Razão Pura', Immanuel Kant supera o embate histórico entre o Racionalismo e o Empirismo por meio do chamado 'Idealismo Transcendental', ao sustentar que:",["Todo conhecimento provém exclusivamente da contemplação mística e inata das ideias divinas perfeitas.","A mente humana é uma folha em branco (tábula rasa) que apenas reflete de forma passiva as impressões dos objetos exteriores.","O conhecimento resulta da síntese entre os dados sensíveis da experiência e as formas a priori da sensibilidade (espaço/tempo) e do entendimento.","A razão humana é incapaz de alcançar qualquer tipo de certeza, tornando o ceticismo radical a única postura válida.","Os sentidos não desempenham nenhum papel cognitivo, sendo a dedução lógica formal o único critério de validação científica."],2,"Kant estabeleceu a 'Revolução Copernicana' da filosofia: o sujeito ativo organiza os dados dispersos da experiência por meio de estruturas cognitivas universais presentes a priori na mente."],
  ["fil",2,"Thomas Kuhn, em sua obra clássica 'A Estrutura das Revoluções Científicas', definiu que o progresso da ciência não ocorre de modo linear e cumulativo contínuo, mas através de:",["Intervenções diretas de governos autoritários que impõem teorias ideológicas aos laboratórios universitários.","Rupturas revolucionárias provocadas pelo acúmulo de anomalias que levam à crise e à substituição de um paradigma por outro.","Adesão incondicional aos textos aristotélicos preservados desde a Antiguidade clássica mediterrânica.","Sessões de escambo e votações populares democráticas em praça pública sobre a validade das leis físicas.","Descobertas casuais de cientistas isolados que operam sem diálogo com as comunidades e tradições de pesquisa."],1,"Para Kuhn, períodos de 'ciência normal' dentro de um paradigma são pontuados por crises teóricas que desencadeiam uma revolução científica com substituição de paradigmas."],
  ["fil",2,"Arthur Schopenhauer, em sua obra magna 'O Mundo como Vontade e Representação', concebe o fundamento metafísico último do universo como uma:",["Razão cósmica benevolente e ordenada que conduz a humanidade a um destino glorioso e pacífico.","Força cega, irracional e incessante denominada Vontade, cuja manifestação nos seres vivos gera sofrimento e carência perpétua.","Engrenagem mecanicista previsível regida estritamente pelas leis da física atômica newtoniana.","Ilusão óptica e linguística que pode ser plenamente dissolvida pela acumulação de riqueza material.","Composição harmônica de átomos e vácuo em equilíbrio perene sem conflito ou decadência existencial."],1,"Para Schopenhauer, a Vontade é uma pulsão cega e insaciável; como os desejos nunca se satisfazem plenamente, a existência humana oscila continuamente entre a dor do querer e o tédio da posse."],
  ["fil",2,"Na filosofia da linguagem do 'segundo' Ludwig Wittgenstein (Investigações Filosóficas), o significado de uma palavra é definido essencialmente por:",["Sua correspondência pictórica e rígida com um objeto físico verificável no mundo factual.","Seu uso prático e compartilhado dentro de contextos sociais regidos por regras, denominados 'jogos de linguagem'.","Sua inscrição genética universal presente na estrutura neurológica de todos os mamíferos.","Sua consonância com os dogmas religiosos revelados e defendidos pela teologia escolástica medieval.","Sua identidade matemática rigorosa deduzida formalmente nos tratados de cálculo proposicional puro."],1,"Romper com a ideia de uma língua ideal e fixa levou Wittgenstein a defender que o sentido das palavras deriva do seu uso contextualizado nas variadas formas de vida e jogos de linguagem."],
  ["fil",2,"O sociólogo Norbert Elias, em 'O Processo Civilizador', demonstrou que a transformação das condutas cotidianas no Ocidente (como o controle de impulsos corporais e etiqueta) esteve associada à:",["Extinção de todas as cortes monárquicas e instauração imediata de democracias populares diretas.","Monopolização estatal da violência física e das taxas fiscais, obrigando os nobres a pacificar seus hábitos competitivos.","Imposição forçada de dietas vegetarianas rígidas por ordens monásticas contemplativas na Idade Média.","Retomada dos jogos olímpicos e dos combates armados de gladiadores em arenas públicas urbanas.","Expulsão de estrangeiros e fechamento das rotas mercantis intercontinentais no mar Mediterrâneo."],1,"Elias evidenciou que a centralização absolutista forçou os nobres a substituir o confronto militar por autocontrole refinado, refinamento de maneiras e contenção das pulsões agressivas."],
  ["fil",2,"Em 'O Mal-Estar na Civilização', Sigmund Freud sustenta que a convivência social civilizada é intrinsecamente geradora de angústia porque exige dos sujeitos a:",["Renúncia e repressão de parte substancial de suas pulsões instintuais mais básicas, em especial a agressividade e a libido.","Dedicação absoluta e contínua às tarefas da agricultura tradicional e ao artesanato corporativo medieval.","Superação total da linguagem escrita em favor de sistemas de comunicação telepática ou mística.","Eliminação definitiva das fronteiras nacionais para a construção de um governo planetário homogêneo.","Abolição imediata de toda forma de arte, de literatura e de manifestações teatrais populares urbanas."],0,"Freud demonstra que a civilização troca uma parcela de liberdade e gratificação pulsional imediata por segurança e estabilidade, resultando em sentimento crônico de culpa e frustração."],
  ["fil",2,"Para a antropóloga Lélia Gonzalez, o conceito de 'Améfrica Ladina' ressalta a importância de compreender a formação histórica do Brasil e da América Latina a partir do protagonismo central das populações:",["Indígenas e afrodescendentes, cuja resistência cultural e linguística forjou a identidade e desmascarou o mito da democracia racial.","Aristocratas ibéricas brancas, que teriam transplantado as virtudes iluministas de forma pura para o continente.","Imigrantes do Leste Europeu que se instalaram exclusivamente na lavoura cafeeira do século XIX.","Nômades mercantis asiáticas que controlavam as minas de ouro no interior de Minas Gerais e Goiás.","Comerciantes britânicas que fundaram as primeiras indústrias têxteis nas capitais litorâneas brasileiras."],0,"Lélia Gonzalez descentralizou o eurocentrismo acadêmico com a categoria de 'Amefricanidade', evidenciando as experiências conjuntas de resistência negra e ameríndia frente ao colonialismo."],
  ["fil",2,"Frantz Fanon, na obra 'Os Condenados da Terra', analisa os impactos psíquicos e sociais da dominação colonial, afirmando que a verdadeira descolonização exige:",["A aceitação passiva dos padrões estéticos e jurídicos estabelecidos pela metrópole colonial dominante.","Um processo radical de transformação das estruturas e subjetividades que desmantele a violência inerente ao sistema colonial.","A assinatura de tratados comerciais assimétricos que assegurem a dependência econômica e financeira das ex-colônias.","A renúncia às manifestações artísticas e linguísticas tradicionais dos povos colonizados.","A manutenção da tutela administrativa estrangeira sobre a educação e a organização judiciária local."],1,"Fanon expõe que o colonialismo é violência em estado puro; logo, a emancipação efetiva do colonizado exige romper com a alienação psíquica e desmontar completamente o aparato colonial."],
  ["fil",2,"Jean-François Lyotard, em 'A Condição Pós-Moderna', caracterizou o espírito pós-moderno fundamentalmente pela:",["Crença irrestrita de que a ciência levará a humanidade à redenção e à paz universal perpétua.","Incredulidade e ceticismo em relação às metanarrativas (grandes teorias teleológicas de emancipação, como o Iluminismo e o Marxismo).","Retomada das cruzadas religiosas medievais para a conquista de Jerusalém e unificação dogmática.","Defesa do retorno à monarquia de direito divino em todas as nações ocidentais industrializadas.","Eliminação de toda inovação tecnológica no campo das comunicações e da microinformática digital."],1,"Lyotard pontuou que o pós-modernismo se define pelo colapso da fé em narrativas unificadoras que prometiam a salvação ou emancipação final da humanidade por meio da história."],
  ["fil",2,"O conceito de 'Racionalidade Instrumental' (ou Razão Instrumental), formulado por Theodor Adorno e Max Horkheimer, alerta para o fato de que, na modernidade, a razão:",["Manteve-se como força puramente humanista voltada para a liberdade, justiça e autonomia de todos os cidadãos.","Converteu-se predominantemente em cálculo de eficácia técnica e dominação da natureza e do homem, servindo a fins destrutivos e mercantis.","Foi substituída pela magia tribal e pelas superstições politeístas ancestrais no controle das indústrias.","Passou a ser guiada exclusivamente por dogmas papais e preceitos teológicos escolásticos da Idade Média.","Alcançou a harmonia ecológica perfeita sem produzir desigualdades sociais ou alienação dos trabalhadores."],1,"Os autores da Teoria Crítica (Dialética do Esclarecimento) denunciam que a razão, em vez de libertar a humanidade, transformou-se em instrumento cego de cálculo, dominação técnica e barbárie."],
  ["fil",2,"A 'Teoria da Justiça como Equidade', do filósofo político John Rawls, utiliza o recurso teórico da 'Posição Original' e do 'Véu da Ignorância' para determinar princípios justos. Esse artifício significa que:",["As leis devem ser redigidas exclusivamente pelas classes detentoras de maior patrimônio e educação formal.","Os indivíduos escolhem os princípios de justiça sem conhecer sua própria posição social, riqueza, gênero, raça ou talentos na sociedade futura.","A única forma legítima de governo é a monarquia hereditária aconselhada por magistrados vitalícios.","Os interesses das minorias étnicas e sociais devem ser subordinados aos lucros das grandes corporações econômicas.","A justiça é impossível em qualquer sociedade e as regras devem ser decididas por loteria ou combates físicos."],1,"Sob o 'véu da ignorância', indivíduos racionais escolheriam princípios que protegessem os mais vulneráveis (princípio da diferença e liberdades básicas iguais), garantindo equidade preventiva."]
];
const app=document.getElementById("app");
let st=null;
const $=s=>B.filter(q=>q[0]==s);
const cnt=(s,l)=>B.filter(q=>q[0]==s&&q[1]==l).length;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nm=k=>SUB.find(s=>s[0]==k);
const L5="ABCDE";

// ----------------------------------------------------
// TELA DE PERFIL (INSTAGRAM ANTIGO)
// ----------------------------------------------------
function profile() {
  st=null;
  app.innerHTML=`
    <div class="insta-profile">
      <div class="insta-topbar">MALUSTAGRAM</div>
      
      <div class="insta-header">
        <img class="profile-pic" src="perfil.jpg" alt="Perfil">
        <div class="profile-info">
          <h2>simulado_etec2027</h2>
          <div class="stats">
            <span><b>9</b> posts</span>
            <span><b>99k</b> followers</span>
            <span><b>1</b> following</span>
          </div>
          <div class="bio">
            ★ ESTUDAR É SWAG!!! <br>
            i <3 my girlfriend.<br>
            <span class="bio-link" onclick="home()">[ SELECIONAR MATÉRIA ]</span>
          </div>
        </div>
      </div>
      
      <div class="insta-divider">
        <span class="active">★ POSTS</span>
        <span>✧ TAGGED</span>
      </div>

      <div class="insta-grid">
        <div class="post" onclick="home()"><img src="sete.jpg" alt="Post 1"></div>
        <div class="post" onclick="home()"><img src="dois.jpg" alt="Post 2"></div>
        <div class="post" onclick="home()"><img src="tres.jpg" alt="Post 3"></div>
        <div class="post" onclick="home()"><img src="quatro.jpg" alt="Post 4"></div>
        <div class="post" onclick="home()"><img src="seis.jpg" alt="Post 5"></div>
        <div class="post" onclick="home()"><img src="cinco.jpg" alt="Post 6"></div>
        <div class="post" onclick="home()"><img src="um.jpg" alt="Post 7"></div>
        <div class="post" onclick="home()"><img src="oito.jpg" alt="Post 8"></div>
        <div class="post" onclick="home()"><img src="nove.jpg" alt="Post 9"></div>
      </div>
    </div>
  `;
  window.scrollTo(0,0);
}

// ----------------------------------------------------
// TELA DE SELEÇÃO DE MATÉRIAS
// ----------------------------------------------------
function home(){
  st=null;
  const savedGeral = localStorage.getItem("simulado_geral_save");
  let btnContinuar = "";
  if (savedGeral) {
    try {
      const parsed = JSON.parse(savedGeral);
      const doneCount = parsed.ans.filter(a => a !== null).length;
      btnContinuar = `<button class="btn" style="margin-bottom:12px; border-color:var(--pr); color:var(--pr);" onclick="resumeGeral()">▶ Continuar Geral (${doneCount}/90 salvas)</button><br>`;
    } catch(e) {}
  }

  app.innerHTML=`<div class="hero">
    <h2>シミュレート ★ SIMULADO</h2>
    <p>Bem-vinda ao simulador de questões da ETEC 2027. Escolha uma matéria e nível abaixo.</p>
    ${btnContinuar}
    <button class="btn g" onclick="start('geral')">✧ Iniciar Simulado Geral (90) ✧</button>
  </div>
  <h3>Coleções / Matérias</h3>
  <div class="grid">${SUB.map(s=>`<div class="card" onclick="subj('${s[0]}')"><div class="e">${s[2]}</div><b>${s[1]}</b><span>[${$(s[0]).length}]</span></div>`).join("")}</div>`;
  window.scrollTo(0,0);
}

function subj(k){
  const s = nm(k);
  app.innerHTML = `
    <button class="back" onclick="home()">← Voltar</button>
    <h2>${s[1]}</h2>
    <p class="sub" style="margin-bottom:30px;">Selecione o nível de dificuldade desejado.</p>
    ${LV.map((n, i) => {
      const count = cnt(k, i);
      const isAvailable = count > 0;
      return `
        <div class="lv" ${isAvailable ? `onclick="start('${k}',${i})"` : ''} style="${isAvailable ? 'cursor:pointer;' : 'opacity:0.4; pointer-events:none;'}">
          <div><span class="tag t${i}">${n}</span></div>
          <div class="sub">${count} itens</div>
          <button class="btn" ${isAvailable ? '' : 'disabled'}>Iniciar ✧</button>
        </div>
      `;
    }).join("")}
  `;
  window.scrollTo(0,0);
}

function start(k, l){
  if (k === "geral" && localStorage.getItem("simulado_geral_save")) {
    if (!confirm("Você já tem um simulado geral em andamento. Deseja recomeçar do zero e apagar o progresso salvo?")) {
      resumeGeral();
      return;
    }
    localStorage.removeItem("simulado_geral_save");
  }

  let pool = k === "geral" ? B : B.filter(q => q[0] === k && q[1] === l);
  if (!pool.length) {
    alert("Não existem questões disponíveis para esta categoria.");
    return;
  }
  if (k === "geral") pool = sh(pool).slice(0, 90);
  
  const items = pool.map(q => {
    const originalOptions = q[3];
    const correctOptionText = originalOptions[q[4]];
    const shuffledOptions = sh(originalOptions);
    const newCorrectIndex = shuffledOptions.indexOf(correctOptionText);

    return {
      q: q[2],
      o: shuffledOptions,
      a: newCorrectIndex,
      e: q[5],
      s: q[0],
      l: q[1]
    };
  });

  st = { k, l, items, ans: Array(items.length).fill(null), i: 0, filter: "all" };
  
  if (k === "geral") saveState();
  quiz();
}

function saveState(){
  if (st && st.k === "geral") {
    localStorage.setItem("simulado_geral_save", JSON.stringify({
      items: st.items,
      ans: st.ans,
      i: st.i
    }));
  }
}

function resumeGeral(){
  const saved = localStorage.getItem("simulado_geral_save");
  if (!saved) return;
  const data = JSON.parse(saved);
  st = {
    k: "geral",
    l: null,
    items: data.items,
    ans: data.ans,
    i: data.i || 0,
    filter: "all"
  };
  quiz();
}

function title(){return st.k=="geral"?"Simulado geral":`${nm(st.k)[1]} · ${LV[st.l]}`}

function quiz(){
const it=st.items[st.i],n=st.items.length,done=st.ans.filter(a=>a!==null).length;
app.innerHTML=`<button class="back" onclick="if(confirm('Deseja pausar e voltar ao menu? (Seu progresso do simulado geral ficará salvo)'))home()">← Pausar / Voltar</button>
<div class="sub"><b>${title()}</b> · Questão ${st.i+1}/${n} · ${done} salvas</div>
<div class="bar"><i style="width:${(st.i+1)/n*100}%"></i></div>
${st.k=="geral"?`<span class="tag t${it.l}" style="margin-bottom:15px; display:inline-block;">${nm(it.s)[1]} · ${LV[it.l]}</span>`:""}
<div class="q">${it.q}</div>
${it.o.map((o,j)=>`<div class="op ${st.ans[st.i]===j?"s":""}" onclick="pick(${j})" style="cursor:pointer;"><b>[${L5[j]}]</b> <span>${o}</span></div>`).join("")}
<div class="nav"><button class="btn" onclick="go(-1)" ${st.i?"":"disabled"}>Anterior</button>
${st.i<n-1?`<button class="btn g" onclick="go(1)">Próxima</button>`:`<button class="btn g" onclick="finish()">Finalizar</button>`}</div>
<div class="dots">${st.items.map((_,i)=>`<button class="${st.ans[i]!==null?"a":""} ${i==st.i?"c":""}" onclick="st.i=${i};quiz()">${i+1}</button>`).join("")}</div>`;
window.scrollTo(0,0)}

function pick(j){
  st.ans[st.i] = j;
  saveState(); // Salva a resposta imediatamente no navegador
  quiz();
}

function go(d){
  st.i += d;
  saveState(); // Salva o número da questão onde ela parou
  quiz();
}

function finish(){
  const un=st.ans.filter(a=>a===null).length;
  if(un&&!confirm(`Deixou ${un} resposta(s) em branco. Finalizar?`))return;
  if(st.k === "geral") {
    localStorage.removeItem("simulado_geral_save"); // Apaga o rascunho pois ela já concluiu
  }
  st.done=true;
  result();
}

function result(){
const n=st.items.length,ok=st.items.filter((x,i)=>st.ans[i]===x.a).length,bl=st.ans.filter(a=>a===null).length,er=n-ok-bl,p=Math.round(ok/n*100);
const list=st.items.map((x,i)=>({x,i,c:st.ans[i]===x.a})).filter(r=>st.filter=="all"||(st.filter=="no"&&!r.c));
app.innerHTML=`<div class="sc"><div class="sub">${title()}</div><div class="n">${p}%</div><div class="sub">${p>=70?"BOM RESULTADO.":p>=50?"ESTUDO RECOMENDADO.":"REVISÃO NECESSÁRIA."}</div>
<div class="st"><span class="g1">✔ ${ok}</span><span class="g2">✘ ${er}</span><span>○ ${bl}</span></div>
<div><button class="btn g" onclick="start('${st.k}',${st.l})">Refazer ★</button> <button class="btn" onclick="home()">Início</button></div></div>
<h3>Relatório</h3><div class="ft"><button class="btn ${st.filter=="all"?"on":""}" onclick="st.filter='all';result()">Tudo</button><button class="btn ${st.filter=="no"?"on":""}" onclick="st.filter='no';result()">Apenas Erros</button></div>
${list.map(({x,i,c})=>`<div class="r"><div class="sub">Q.${i+1}${st.k=="geral"?" · "+nm(x.s)[1]+" · "+LV[x.l]:""} · <span class="${c?"g1":"g2"}">${c?"CORRETO":"INCORRETO"}</span></div><p>${x.q}</p>
<div class="sub">Resposta: <span class="${c?"g1":"g2"}">${st.ans[i]===null?"—":"["+L5[st.ans[i]]+"] "+x.o[st.ans[i]]}</span></div>
${c?"":`<div class="sub">Correta: <span class="g1">[${L5[x.a]}] ${x.o[x.a]}</span></div>`}<div class="ex">Análise: ${x.e}</div></div>`).join("")||"<div class='sub' style='text-align:center;'>Nenhum erro reportado.</div>"}`;
window.scrollTo(0,0)}

// Arranca diretamente no perfil!
profile();
</script>
</body>
</html>
