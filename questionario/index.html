  ["bio",2,"Na fase luminosa da fotossíntese (reações fotoquímicas), ocorre a fotólise da água. Qual é a principal importância desse evento?",["Produzir glicose diretamente a partir da água.","Fornecer íons H⁺ e elétrons para a cadeia transportadora, libertando oxigênio (O₂) como subproduto.","Transformar o oxigênio em dióxido de carbono.","Produzir calor para aquecer as folhas.","Fixar o carbono no ciclo de Calvin."],1,"A água é 'quebrada' pela luz, libertando O₂ para a atmosfera e eletrões/protões para formar ATP e NADPH."],
  ["bio",2,"O daltonismo é uma herança ligada ao sexo recessiva. Se um homem daltônico tem filhos com uma mulher normal (cujos pais não eram daltônicos nem tinham o gene), qual a probabilidade de terem filhas daltônicas?",["0%","25%","50%","75%","100%"],0,"O homem passa o X daltônico (Xd) às filhas, mas como a mãe é homozigótica normal (XX), todas as filhas serão XDXd (portadoras, mas visão normal)."],
  ["bio",2,"Sobre a síntese de proteínas, o que é o 'código genético' universal?",["A própria molécula de DNA em dupla hélice.","A correspondência entre códons (trincas de RNAm) e os aminoácidos que eles codificam.","A ligação peptídica entre duas proteínas.","O número de cromossomas de uma espécie (ex: 46 no homem).","O processo de mitose celular."],1,"A trinca de nucleotídeos (códon) traduz-se de forma quase universal num aminoácido específico em todos os seres vivos."],
  ["bio",2,"A bomba de sódio e potássio (Na⁺/K⁺) nas membranas celulares é um exemplo de transporte:",["Passivo, a favor do gradiente de concentração.","Osmose reversa.","Ativo, que gasta energia (ATP) para ir contra o gradiente de concentração.","Difusão facilitada através de canais fechados.","Endocitose."],2,"A célula gasta energia para manter muito K⁺ dentro e muito Na⁺ fora, essencial para o impulso nervoso."],
  ["bio",2,"Segundo o princípio de Hardy-Weinberg, uma população em equilíbrio genético não evolui. Qual destas condições DEVE ocorrer para que esse equilíbrio se mantenha?",["Alta taxa de mutação.","Migração constante de indivíduos.","Cruzamentos não aleatórios (preferenciais).","População infinitamente grande e ausência de seleção natural.","Deriva genética intensa."],3,"Numa população enorme, com panmixia (cruzamentos ao acaso) e sem forças evolutivas (mutação, migração, seleção), as frequências alélicas não mudam."],
  ["bio",2,"As cianobactérias foram fundamentais na história da Terra porque:",["Causaram a extinção dos dinossauros.","Foram os primeiros seres a respirar fora da água.","Inventaram a mitose celular.","Foram os primeiros fotossintetizantes, introduzindo oxigênio (O₂) na atmosfera primitiva.","São os ancestrais diretos dos vírus modernos."],3,"O acúmulo de O₂ criado pelas cianobactérias (Grande Evento de Oxidação) mudou o planeta e permitiu a vida aeróbica celular."],
  ["bio",2,"A organela celular conhecida como Lisossoma contém enzimas digestivas hidrolíticas. Se essas enzimas 'vazarem' em grande quantidade, o que pode ocorrer?",["A célula divide-se mais rápido.","A autólise celular (a célula digere-se e morre).","Aumento brutal da produção de ATP.","Transformação da célula animal em vegetal.","Nada, pois as enzimas só funcionam fora da célula."],1,"Esse processo é usado, por exemplo, na reabsorção da cauda do girino, mas se for acidental, destrói a célula."],
  ["bio",2,"Na embriologia animal, o estágio de 'Gástrula' é caracterizado principalmente pela:",["Formação de uma massa maciça de células (Mórula).","Cavitação formando uma esfera oca (Blástula).","Diferenciação dos folhetos embrionários (ectoderme, mesoderme, endoderme) e do intestino primitivo (arquêntero).","Formação do tubo neural e do sistema nervoso.","Nascimento do indivíduo completo."],2,"A gastrulação marca a invaginação celular e o início da formação dos tecidos e órgãos primordiais."],
  ["bio",2,"As briofitas (ex: musgos) são plantas de pequeno porte que não conseguem crescer muito porque:",["Não possuem folhas verdadeiras.","Vivem apenas no escuro.","São avasculares (não possuem vasos condutores de seiva - xilema e floema).","Não realizam fotossíntese.","Possuem raízes gigantes que as puxam para baixo."],2,"Sem vasos condutores, a água e os nutrientes passam de célula a célula por osmose/difusão, limitando drasticamente o seu tamanho."],
  ["bio",2,"A Teoria Endossimbiótica, proposta por Lynn Margulis, explica a origem de quais organelos?",["Lisossomas e Peroxissomas","Núcleo e Retículo Endoplasmático","Centríolos e Citoesqueleto","Mitocôndrias e Cloroplastos","Complexo de Golgi e Vacúolos"],3,"Mitocôndrias e cloroplastos têm DNA próprio e membranas duplas, indicando que já foram bactérias independentes englobadas por uma célula ancestral."],
  ["bio",2,"No sistema imunológico humano, os Linfócitos T CD4 (ou T-helper) são cruciais porque:",["Eles comem bactérias por fagocitose.","São eles que transportam o oxigênio em emergências.","Eles comandam a resposta imune, ativando outras células (são o alvo do vírus HIV).","Eles produzem as lágrimas e a saliva.","Formam crostas nas feridas."],2,"O HIV destrói os T CD4, causando a SIDA (AIDS), pois o sistema imunitário fica sem o seu 'comandante' e vulnerável a infeções oportunistas."],
  ["bio",2,"Em relação aos hormônios vegetais (fitormônios), o Etileno é famoso por sua ação na:",["Inibição do crescimento lateral da planta.","Germinação rápida de sementes (quebra de dormência).","Queda das folhas e, principalmente, no amadurecimento dos frutos.","Orientação da planta em direção à luz (fototropismo).","Absorção de água na raiz."],2,"O etileno é um gás que induz o amadurecimento dos frutos (por isso, embrulhar uma fruta em jornal acelera o processo)."],
  ["bio",2,"A respiração aeróbica completa rende muito mais ATP que a fermentação (anaeróbica). Qual é o papel do Oxigênio (O₂) na respiração celular?",["Reagir com a glicose logo no início (Glicólise).","Atuar como aceptor final de elétrons na Cadeia Respiratória, juntando-se a íons H⁺ para formar água.","Destruir as mitocôndrias velhas.","Transformar o ácido lático em piruvato.","Absorver a luz solar nos pulmões."],1,"Sem O₂ no final da cadeia, a produção pesada de ATP para e a célula morre ou faz fermentação."],
  ["bio",2,"Num heredograma, pais fenotipicamente normais têm uma filha afetada por uma doença genética grave. Isso prova que a herança dessa doença é:",["Autossômica Dominante","Ligada ao cromossoma Y (Restrita ao sexo)","Ligada ao cromossoma X dominante","Autossômica Recessiva","Ligada ao cromossoma X recessiva"],3,"Se pais iguais têm filho diferente (com a doença), os pais são heterozigotos portadores (Aa), e a doença é obrigatoriamente recessiva (aa)."],
  ["bio",2,"O daltonismo e a hemofilia são exemplos de herança ligada ao sexo. Por que os homens (XY) são mais afetados por essas condições recessivas do que as mulheres (XX)?",["O cromossoma Y possui genes que ativam essas doenças.","Os homens não possuem o hormônio estrogênio para proteger os olhos.","Como têm apenas um cromossoma X, um único alelo recessivo já manifesta a doença. Mulheres precisam de dois.","Porque os homens têm dois cromossomas X enfraquecidos.","Porque é passado exclusivamente de pai para filho homem."],2,"A mulher (XDXd) é apenas portadora normal; o homem (XdY) não tem outro X dominante para compensar o defeito."],
  ["bio",2,"A Esquistossomose (barriga d'água) é causada por um verme platelminto (*Schistosoma*). Qual é o seu hospedeiro intermediário vital?",["Mosquito Aedes aegypti","Caramujo de água doce (gênero Biomphalaria)","Porco ou Boi mal cozido","Cachorro de rua","Mosca varejeira"],1,"As larvas (miracídios) precisam entrar no caramujo aquático para virar cercárias, que depois furam a pele do ser humano que entra nas lagoas."],
  ["bio",2,"No Ciclo do Nitrogênio, bactérias do gênero *Rhizobium* associam-se às raízes de plantas leguminosas (feijão, soja). Qual o papel dessas bactérias?",["Devolver o nitrogênio gasoso (N₂) para o ar (desnitrificação).","Matar fungos invasores nas raízes.","Fixar o nitrogênio atmosférico transformando-o em amônia, que será usada pela planta.","Transformar nitrito em nitrato.","Produzir oxigênio puro para a raiz respirar."],2,"A planta ganha nitrogênio utilizável para fazer proteínas, e as bactérias ganham abrigo e açúcares (mutualismo)."],
  ["bio",2,"Sabe-se que 20% das bases nitrogenadas do DNA de um organismo são Citosina (C). Qual é a porcentagem de Guanina (G) e Timina (T), respectivamente?",["20% e 20%","30% e 20%","20% e 30%","30% e 30%","10% e 40%"],2,"Regra de Chargaff: C liga-se com G (logo G = 20%). A soma C+G = 40%. Restam 60% para A e T. Como A liga com T, cada um tem 30%."],
  ["bio",2,"Durante a especiação alopátrica, o evento fundamental que inicia a divisão de uma espécie em duas é o(a):",["Mecanismo de isolamento reprodutivo comportamental imediato.","Isolamento geográfico (uma barreira física que separa a população em duas).","Competição severa por comida sem separação de área.","Alta taxa de clonagem.","Poluição química severa do ambiente."],1,"A barreira física impede a troca de genes. Mutações diferentes acumulam-se de cada lado até gerarem isolamento reprodutivo definitivo."],
  ["bio",2,"O pâncreas é uma glândula mista (anfícrina). Além da porção endócrina (insulina/glucagon), o que sua porção exócrina secreta?",["Suco pancreático contendo enzimas digestivas, lançado no duodeno.","Bile, que emulsifica as gorduras.","Saliva extra para a garganta.","Ácido clorídrico diretamente no estômago.","Lágrimas e suor sob stress."],0,"O suco pancreático neutraliza a acidez gástrica e possui lípases, proteases e amilases cruciais para a digestão."],
  ["bio",2,"Em Ecologia, a 'Sucessão Ecológica Primária' é aquela que ocorre em:",["Florestas desmatadas por queimadas recentes.","Áreas de pastagem abandonadas.","Campos agrícolas inundados temporariamente.","Ambientes totalmente estéreis que nunca abrigaram vida antes (ex: lavas vulcânicas sólidas).","Florestas clímax já consolidadas."],3,"Diferente da sucessão secundária (onde já havia terra e vida prévia), a primária precisa criar solo a partir da rocha nua através dos líquenes."],
  ["bio",2,"O 'Crossing-over' (Permutação) é um evento crucial para a evolução porque gera variabilidade genética. Em que fase exata ele ocorre?",["Metáfase da Mitose","Prófase I da Meiose I","Anáfase II da Meiose II","Telófase da Mitose","Fase S da Interfase"],1,"Durante a Prófase I, os cromossomas homólogos emparelham e trocam pedaços de DNA entre si."],
  ["bio",2,"O Filo Mollusca abriga animais como polvos, lulas e caracóis. Qual estrutura exclusiva da maioria dos moluscos (ausente em bivalves) é usada para raspar os alimentos?",["Rádula","Quelíceras","Tentáculos com ventosas","Moela trituradora","Tentáculos urticantes"],0,"A rádula funciona como uma língua com dentes quitinosos microscópicos que raspa superfícies para retirar alimento."],
  ["bio",2,"O hormônio ADH (Antidiurético ou Vasopressina), armazenado na neuro-hipófise, atua diretamente nos rins promovendo a:",["Eliminação máxima de água e minerais.","Reabsorção de glicose pela urina.","Reabsorção de água, diminuindo o volume da urina e concentrando-a.","Destruição das pedras nos rins.","Troca de sódio por potássio ativamente."],2,"O álcool inibe o ADH, o que explica por que ingerir bebidas alcoólicas faz urinar em excesso e causa desidratação (ressaca)."],
  ["bio",2,"A presença de estruturas vestigiais (como o apêndice vermiforme humano) em espécies atuais é uma evidência evolutiva indicando que:",["O criador colocou peças inúteis nos animais.","A espécie sofreu regressão por falta de uso individual.","As espécies modernas foram criadas de uma só vez com falhas de design.","A estrutura era funcional num ancestral comum, mas perdeu a sua utilidade primária ao longo da história evolutiva.","As mutações ocorrem exclusivamente nesses órgãos."],3,"Órgãos vestigiais, como os resquícios de patas em cobras e baleias, confirmam a ancestralidade e mudança temporal (Evolução)."],

  // FILOSOFIA/SOCIOLOGIA - NÍVEL FÁCIL (0) - 25 QUESTÕES
  // ==========================================
  ["fil",0,"O que a palavra 'Filosofia' significa literalmente (do grego)?",["Amor pela guerra.","Ciência exata.","Amor à sabedoria.","Crença nos deuses.","Dúvida eterna."],2,"'Philos' (amor/amizade) + 'Sophia' (sabedoria). Os filósofos gregos definiam-se como amantes do saber."],
  ["fil",0,"Quem é conhecido como o 'Pai da Filosofia Ocidental', famoso pela frase 'Só sei que nada sei'?",["Platão","Aristóteles","Sócrates","Nietzsche","Marx"],2,"Sócrates (séc. V a.C.) revolucionou a filosofia focando na ética humana e no reconhecimento da própria ignorância como princípio do conhecimento."],
  ["fil",0,"Em Sociologia, como chamamos as regras e padrões de comportamento que a sociedade espera que sigamos?",["Instintos biológicos","Normas sociais","Delírios coletivos","Verdades absolutas","Leis da física"],1,"As normas sociais são os 'códigos invisíveis' (ou visíveis, como leis) que regulam a convivência em grupo."],
  ["fil",0,"A atitude de julgar e menosprezar a cultura de outros povos usando a sua própria cultura como o 'certo' ou superior é o:",["Relativismo cultural","Egocentrismo","Etnocentrismo","Darwinismo social","Altruísmo"],2,"O Etnocentrismo é a visão preconceituosa que coloca o próprio grupo (etnia/cultura) no centro, depreciando os demais."],
  ["fil",0,"Qual é o nome dado ao conjunto de crenças, costumes, língua, arte e tradições de um grupo social?",["Raça","Biotipo","Etnia","Cultura","Política"],3,"A cultura é a 'teia de significados' que os seres humanos tecem e transmitem de geração em geração."],
  ["fil",0,"O conhecimento baseado em crenças populares, tradições e no dia a dia, sem rigor científico, é o:",["Conhecimento filosófico","Senso comum (conhecimento empírico)","Conhecimento científico","Conhecimento teológico","Ceticismo"],1,"O senso comum não exige provas ou métodos rigorosos, guiando-se pela repetição e experiência prática cotidiana."],
  ["fil",0,"Os primeiros filósofos gregos (Pré-socráticos) investigavam principalmente o quê?",["A política nas cidades.","A psique e a alma humana.","O princípio de todas as coisas na natureza (Physis e Arché).","As leis do Império Romano.","O modo de produzir dinheiro rápido."],2,"Eles queriam descobrir qual elemento (água, fogo, átomos) era a origem racional de tudo, abandonando as explicações mitológicas."],
  ["fil",0,"O processo em que um indivíduo aprende e interioriza as regras, valores e a cultura da sua sociedade (começando na infância) chama-se:",["Socialização","Alienação","Urbanização","Marginalização","Industrialização"],0,"A família, escola e amigos são os principais agentes de socialização na formação do ser social."],
  ["fil",0,"Qual destas instituições é considerada pela Sociologia como o primeiro grupo social do indivíduo (Socialização primária)?",["O Exército","O Governo","A Escola","A Família","O Mercado de Trabalho"],3,"A família apresenta ao recém-nascido as emoções básicas, a linguagem e as primeiras regras de convivência."],
  ["fil",0,"Para a Sociologia, o preconceito racial e o racismo estrutural decorrem principalmente de:",["Diferenças biológicas comprovadas pelo QI humano.","Padrões sociais, históricos e culturais aprendidos e reproduzidos na sociedade.","Escolhas individuais aleatórias que somem na vida adulta.","Ausência de convivência geográfica.","Falha exclusiva das leis federais modernas."],1,"O racismo não tem base biológica (raças humanas biológicas não existem); é uma construção e hierarquização puramente social e histórica."],
  ["fil",0,"O Renascimento Iluminista marcou a passagem do pensamento teocêntrico (Deus no centro) para o pensamento:",["Cosmocêntrico","Antropocêntrico (O homem e a razão no centro)","Egocêntrico","Mítico","Nihilista"],1,"Com o fim da Idade Média, o foco mudou para a capacidade humana, a ciência e a razão (Antropocentrismo)."],
  ["fil",0,"Em termos sociais, a divisão da sociedade entre os 'muito ricos' e os 'muito pobres' é chamada de:",["Globalização","Desigualdade social","Mobilidade social","Meritocracia plena","Diversidade cultural"],1,"A desigualdade social reflete a má distribuição de renda e o acesso desigual a direitos e serviços básicos."],
  ["fil",0,"A frase 'O ser humano é um animal político' foi dita por qual filósofo clássico?",["Sócrates","Karl Marx","Aristóteles","Tales de Mileto","John Locke"],2,"Aristóteles queria dizer que, por natureza, o homem precisa de viver em sociedade (pólis) para ser pleno e feliz."],
  ["fil",0,"Quando dizemos que meninos devem usar azul e meninas rosa, a Sociologia classifica isso como:",["Uma lei inquebrável da biologia.","Um instinto animal primário.","Um papel de gênero construído socialmente.","Uma verdade filosófica eterna.","Um fato puramente climático."],2,"Cores não têm sexo biológico; a associação é puramente uma convenção criada por normas culturais recentes."],
  ["fil",0,"O movimento liderado por mulheres em busca de igualdade de direitos sociais, políticos e económicos com os homens é o:",["Machismo","Sufismo","Feminismo","Anarquismo","Comunismo"],2,"O feminismo histórico desconstruiu a submissão legal feminina e garantiu avanços como o direito ao voto (sufrágio) e ao trabalho assalariado."],
  ["fil",0,"As narrativas fantásticas antigas com deuses, heróis e monstros usadas para explicar trovões, estações do ano e o destino humano são chamadas de:",["Leis físicas","Mitos","Hipóteses filosóficas","Senso crítico","Teses científicas"],1,"O mito era a principal forma de conhecimento antes do surgimento da Filosofia, que passou a buscar explicações baseadas na razão."],
  ["fil",0,"Se uma pessoa pobre se esforça, estuda muito e torna-se um médico rico, ocorreu um exemplo claro de:",["Luta de classes violenta.","Êxodo rural.","Mobilidade social ascendente.","Socialização primária.","Etnocentrismo."],2,"A mobilidade social indica a mudança de posição de um indivíduo ou grupo dentro da hierarquia (estratificação) da sociedade."],
  ["fil",0,"A declaração adotada pela ONU em 1948, após os horrores do nazismo, garantindo liberdade e dignidade a todos no planeta, é a:",["Declaração de Independência dos EUA","Carta de Pero Vaz de Caminha","Declaração Universal dos Direitos Humanos","Constituição Cidadã Brasileira","Magna Carta Medieval"],2,"A DUDH é o pilar moderno que estabelece que todos nascem livres e iguais em dignidade e direitos."],
  ["fil",0,"Na escola, você deve usar uniforme, chegar a horas e respeitar o professor. Estes comportamentos esperados refletem:",["A falta de liberdade total do estado natural.","Uma forma de violência física explícita.","O controle e a disciplina impostos por uma instituição social.","O caos estrutural do século XXI.","O instinto genético de submissão."],2,"As instituições sociais (como a escola) moldam o comportamento dos indivíduos para garantir a ordem social vigente."],
  ["fil",0,"Um argumento filosófico é considerado 'lógico' quando:",["Quem fala grita mais alto e convence os outros pelo medo.","Ele é feito exclusivamente por pessoas famosas e antigas.","As suas conclusões derivam organizadamente das suas premissas sem contradições.","Ele usa muitas palavras difíceis e complexas sem sentido prático.","Ele ofende pessoalmente a opinião alheia."],2,"A lógica (fundada por Aristóteles) analisa se um raciocínio é válido e se a sua estrutura não contém falácias (erros)."],
  ["fil",0,"Qual é o nome dado à classe de pessoas que, para sobreviver, vendem sua força de trabalho em troca de salário (na visão marxista)?",["Burguesia","Nobreza","Clero","Proletariado (Trabalhadores)","Aristocracia"],3,"Karl Marx chamava os trabalhadores assalariados de proletários, por não serem donos dos meios de produção (fábricas, terras)."],
  ["fil",0,"A fase da vida conhecida como 'Adolescência' (com os seus conflitos e rebeldias):",["Sempre existiu da mesma forma desde os homens das cavernas.","É puramente biológica, sem interferência da sociedade.","É uma invenção social moderna; em outras épocas passava-se direto da infância para a vida adulta e de trabalho.","Só existe no Brasil e em países em desenvolvimento.","É evitada nas sociedades capitalistas contemporâneas."],2,"A adolescência como moratória (fase de espera e estudo) surgiu e consolidou-se com as revoluções industriais e no pós-guerra do século XX."],
  ["fil",0,"A xenofobia é um preconceito dirigido a quem?",["Pessoas mais velhas.","Pessoas de orientação sexual diferente.","Estrangeiros ou pessoas de outras regiões/culturas.","Pessoas com deficiência física.","Mulheres em cargos de liderança."],2,"Xeno (estrangeiro) + fobia (medo/aversão). É uma discriminação hostil contra imigrantes e suas culturas."],
  ["fil",0,"Quando você obedece ao sinal vermelho do semáforo, mesmo às 3 da manhã sem ninguém na rua, age principalmente pelo poder da:",["Coerção ou Regulação Social interiorizada.","Genética de sobrevivência ao trânsito.","Hipnose coletiva governamental.","Fobia de cores quentes.","Solidariedade comunitária natural."],0,"As normas sociais são internalizadas de tal forma que as seguimos até quando ninguém está a ver (controle social)."],
  ["fil",0,"Para a Sociologia, o trabalho infantil no século XIX (Revolução Industrial) foi amplamente combatido depois por:",["Ser fisicamente impossível uma criança operar máquinas.","Ser considerado pelas novas leis e visão dos direitos das crianças como uma violação do desenvolvimento humano.","Proibição direta vinda exclusivamente de dogmas religiosos.","As crianças ganharam o direito de comandar exércitos militares.","Falta de fábricas disponíveis na Europa daquela época."],1,"Com a regulamentação do trabalho e o surgimento dos Direitos Humanos, as crianças passaram a ter o lugar reservado na escola, e não nas fábricas perigosas."],

  // ==========================================
  // FILOSOFIA/SOCIOLOGIA - NÍVEL MÉDIO (1) - 25 QUESTÕES
  // ==========================================
  ["fil",1,"No famoso 'Mito da Caverna', Platão compara os prisioneiros que apenas veem sombras na parede aos:",["Guerreiros defendendo a cidade de invasores.","Homens comuns que se contentam com as aparências ilusórias (senso comum) sem buscar a verdade das ideias.","Filósofos sábios que dominam a matemática avançada.","Deuses gregos brincando com o destino dos mortais.","Políticos iluminados governando de forma justa."],1,"Platão argumentava que a verdadeira realidade estava fora da caverna (Mundo das Ideias/Inteligível) e que os sentidos (sombras) nos enganam."],
  ["fil",1,"'Penso, logo existo' (Cogito ergo sum) é a premissa fundamental do racionalismo moderno. Quem é o autor?",["Sartre","Kant","René Descartes","Hegel","David Hume"],2,"Descartes usou a 'dúvida metódica' duvidando de absolutamente tudo, até perceber que se ele duvidava, ele pensava; e se pensava, ele existia."],
  ["fil",1,"Émile Durkheim, pai da Sociologia moderna, afirmou que a sociedade impõe regras aos indivíduos de fora para dentro. Ele chamou esses padrões culturais independentes de:",["Ação social racional.","Fato social.","Luta de classes.","Materialismo histórico.","Indústria cultural."],1,"Os 'fatos sociais' (ex: o idioma, a moda, o sistema bancário) são coercitivos, exteriores ao indivíduo e gerais em toda a sociedade."],
  ["fil",1,"Para Max Weber, a Sociologia deve focar na compreensão da 'Ação Social'. O que define uma Ação Social para ele?",["Qualquer movimento biológico inconsciente (como espirrar).","Comportamento de manada puramente animal em busca de alimento.","Qualquer ação que um indivíduo pratica levando em conta (orientando-se por) a reação ou expectativa de outros indivíduos.","Uma revolução armada que muda a forma de governo de um país em poucos dias.","O ato de sonhar enquanto se dorme profundamente."],2,"Para Weber, a ação social precisa ter um 'sentido' ou intenção relacionada com o outro. Se abrir o guarda-chuva para não se molhar é só ação; abri-lo para não molhar a pessoa ao lado é Ação Social."],
  ["fil",1,"O contratualista Jean-Jacques Rousseau acreditava que no Estado de Natureza (antes da sociedade), o homem era:",["Um 'lobo' egoísta, mau por natureza, vivendo em guerra constante.","Submisso a leis divinas impostas por anjos bíblicos.","O 'Bom Selvagem', vivendo pacificamente e de forma livre, sendo corrompido apenas após o surgimento da propriedade privada e da sociedade.","Um ser totalmente apático que não interagia com nada ao seu redor.","Extremamente competitivo por dinheiro, inventando bancos nas florestas."],2,"Rousseau cunhou a famosa frase: 'O homem nasce bom, a sociedade o corrompe', contrastando com a visão pessimista de Thomas Hobbes."],
  ["fil",1,"Maquiavel, autor de 'O Príncipe', separou a moral privada da política. Segundo a sua visão realista do poder:",["O governante deve sempre ser bondoso e transparente, não importando a perda do trono.","A religião deve ditar as regras dos exércitos reais.","O governante (príncipe) deve fazer o que for necessário para manter o poder e a estabilidade do Estado, não se prendendo a normas morais comuns.","O líder só é legítimo se for democraticamente eleito pelas mulheres da sociedade antiga.","Os fins não justificam os meios em hipótese alguma na política."],2,"Daí surgiu (de forma distorcida) a frase popular 'os fins justificam os meios'. Maquiavel focou na 'virtù' (habilidade política) e na 'fortuna' (sorte/ocasião)."],
  ["fil",1,"Na visão de Karl Marx, o motor principal que faz a História avançar em todas as épocas (senhores x escravos, nobres x servos, burgueses x proletários) é a:",["Solidariedade orgânica mútua.","Vontade pacífica de Deus perante os povos.","Evolução natural biológica (Darwinismo social).","A Luta de Classes (conflito por interesses materiais e económicos).","Evolução da linguagem escrita em escolas clássicas."],3,"Marx afirma no Manifesto Comunista (1848) que 'a história de toda a sociedade até os nossos dias é a história da luta de classes'."],
  ["fil",1,"O conceito de 'Mais-Valia', desenvolvido por Marx, refere-se a:",["O imposto cobrado pelos governos comunistas aos trabalhadores rurais modernos.","O valor da amizade e da moral na fábrica.","O tempo de trabalho não remunerado do trabalhador, do qual o capitalista extrai o seu lucro.","A valorização das ações da empresa na bolsa de valores gerando dinheiro rápido para o pobre.","O acréscimo de valor que um produto ganha pela marca famosa colada nele (ex: moda)."],2,"É a diferença entre o valor que o operário produz com o seu trabalho e o que ele recebe de salário; essa diferença (trabalho não pago) vira o lucro burguês."],
  ["fil",1,"Como Santo Agostinho (Filosofia Patrística Medieval) conciliou a fé cristã com o problema do mal no mundo, se Deus é puramente bom?",["O mal foi criado por Deus propositalmente para testar a força bruta humana.","O mal é um Deus menor e independente lutando contra o Deus bom.","O mal não existe como 'coisa', ele é a ausência/privação do bem, resultado do livre-arbítrio humano de se afastar de Deus.","A Bíblia foi reescrita e o mal é apenas uma ilusão holográfica no universo material.","Deus não é onipotente perante as tragédias naturais da Terra moderna."],2,"Agostinho tirou de Deus a autoria do mal. O homem, por ter livre escolha, decide pecar afastando-se da luz divina (o mal como sombra/privação)."],
  ["fil",1,"Na Sociologia Contemporânea, Pierre Bourdieu criou o conceito de 'Capital Cultural'. O que é isso?",["O dinheiro vivo guardado em bancos para pagar bilhetes de espetáculos caros e viagens europeias.","A posse de saberes, diplomas, sotaques cultos, etiqueta e 'bom gosto' que garantem vantagens sociais além do dinheiro financeiro puro.","Os edifícios de patrimônio tombado controlados por prefeituras estaduais nas capitais culturais.","O conjunto de ferramentas e máquinas pesadas que os operários usam numa fábrica textil para enriquecer culturalmente o patrão.","Apenas a quantidade de línguas que uma pessoa fala misturada geneticamente no seu DNA."],1,"Bourdieu explica que a elite não se mantém apenas com 'Capital Económico' (dinheiro), mas sim investindo nesse 'Capital Cultural' para se distanciar dos mais pobres e garantir os melhores empregos."],
  ["fil",1,"A Maiêutica de Sócrates, método no qual ele fazia perguntas aos atenienses nas praças, tinha o propósito de:",["Fazer a pessoa passar vergonha e ser presa pelo Estado grego imediatamente como traidora.","Ensinar teorias prontas e complexas através de aulas gigantes e silenciosas.","Questionar as certezas da pessoa até que ela, sozinha, percebesse a sua ignorância e 'desse à luz' (parisse) novas ideias e verdades escondidas na sua mente.","Cobrar dinheiro pelas respostas (método dos sofistas).","Vender mercadorias asiáticas raras por meio de debates comerciais e charadas verbais."],2,"A mãe de Sócrates era parteira. Ele dizia que, ao invés de parir corpos, o seu método de diálogos ajudava as mentes a parirem ideias (Maiêutica)."],
  ["fil",1,"A palavra 'Ética' distingue-se de 'Moral' em Filosofia porque:",["A ética são os costumes práticos da sociedade, enquanto a moral é a lei escrita pelo governo.","A moral é a reflexão teórica e universal, enquanto a ética é religiosa e baseada em castigos divinos severos.","A moral são as regras e costumes práticos de uma cultura local (aquilo que se faz), e a ética é a reflexão filosófica/teórica sobre essas regras (o porquê se faz).","Não há nenhuma diferença, ambas referem-se estritamente à não agressão física aos animais na sociedade atual.","Ética só existe nos negócios comerciais privados e a moral no ambiente religioso íntimo e doméstico."],2,"Enquanto a Moral muda conforme a cultura e a época (ex: poligamia é moral no Oriente, mas não aqui), a Ética é a ciência que estuda a validade e a base desses valores morais globalmente."],
  ["fil",1,"A escola sociológica de Frankfurt (Adorno e Horkheimer) criticou massivamente a 'Indústria Cultural'. O que ela faz segundo eles?",["Produz arte crítica para revoluções intelectuais da classe trabalhadora moderna.","Transforma a arte e a cultura em mercadorias estandardizadas (fórmulas prontas) para entreter e alienar o povo, impedindo o pensamento crítico (ex: músicas hit chiclete).","Incentiva o estudo aprofundado dos clássicos nas escolas periféricas e cinemas.","Gera lucros que são totalmente distribuídos aos empregados das emissoras e rádios públicas das metrópoles globais.","Rejeita a tecnologia no entretenimento."],1,"A Indústria Cultural padroniza gostos. Ao invés da arte elevar o humano, ela anestesia o público, mantendo-o consumindo sem questionar a sociedade."],
  ["fil",1,"Zygmunt Bauman criou o conceito de 'Modernidade Líquida' para explicar o nosso século XXI. Isso significa que:",["As relações humanas, o trabalho e os valores hoje são instáveis, fluidos e mudam rapidamente, ao contrário do passado 'sólido' e duradouro.","As pessoas bebem mais água devido ao aquecimento global.","Os governos perderam o poder territorial, funcionando exclusivamente em navios nos oceanos internacionais.","O amor e a amizade modernos duram para sempre sem sofrer impacto das redes sociais rápidas da internet atual.","O capitalismo falhou e foi substituído pelo escambo líquido de commodities."],0,"Tudo é flexível, frágil e descartável, desde os amores em aplicativos (Tinder) até os empregos instáveis."],
  ["fil",1,"Em 'Vigiar e Punir', Michel Foucault analisou o panóptico (sistema prisional circular onde o vigia vê tudo sem ser visto). Para ele, as sociedades modernas:",["São mais livres que na Idade Média, abolindo o controle social e penal cruel inteiramente no ocidente.","Não usam mais punições de nenhum tipo, preferindo a anarquia pacífica nas ruas das megalópoles.","Deixaram de torturar em praça pública para aplicar uma disciplina invisível e microfísica sobre os corpos das pessoas nas escolas, fábricas, prisões e hospitais.","Focam exclusivamente no castigo divino e espiritual (Inquisição) em vez da lei terrena e materialista dos juízes estatais civis.","Dependem apenas de câmeras físicas nas prisões federais americanas sem aplicar isso ao cidadão de bem civil europeu."],2,"A sociedade disciplinar molda docilmente o corpo humano para ser útil ao sistema através do vigiar constante, interiorizando a submissão no próprio sujeito."],
  ["fil",1,"John Locke, o 'pai do Liberalismo', defendia que os seres humanos possuem Direitos Naturais (Jusnaturalismo) inalienáveis. Quais eram os principais?",["Vida, Liberdade e Propriedade Privada (fruto do trabalho).","Direito ao Voto, Férias Remuneradas e Moradia do Estado.","Submissão ao Rei Absoluto, Guerra e Riqueza Feudal.","Guerra, Igualdade Econômica Total e Abolição da Herança familiar secular.","Direito Divino de Governar as Terras Indígenas Americanas puras no oceano atlântico e pacífico norte e sul globalmente."],0,"Esses direitos precedem o Estado. O governo existe apenas para protegê-los; caso não o faça, o povo tem direito à revolta, inspirando a Revolução Americana."],
  ["fil",1,"Na filosofia sofista antiga (Grécia), Protágoras disse: 'O homem é a medida de todas as coisas'. Isso significa que:",["Existe uma verdade absoluta dada pelos deuses gregos eternamente no Monte Olimpo inviolável para a sociedade.","A matemática e a física moderna respondem a todas as angústias humanas e espirituais contemporâneas racionalmente no cosmos infinito.","A verdade é relativa e subjetiva, dependendo da perspectiva, da opinião e da capacidade de persuasão de cada indivíduo naquele contexto específico culturalmente.","Todos os homens têm a mesma altura física na Grécia Antiga.","O homem deve ser o juiz imparcial acima dos deuses e puni-los filosoficamente por seus crimes mitológicos contra a lógica moral socrática rígida."],2,"O Relativismo Sofista afirmava que não há verdade absoluta; a 'verdade' é aquela que ganha o debate pela oratória."],
  ["fil",1,"O 'Darwinismo Social' (século XIX) justificou o Imperialismo Europeu e o racismo utilizando erroneamente as teses biológicas da evolução de Darwin. Eles diziam que:",["Todas as culturas deveriam ser preservadas na África e na Ásia com investimentos e proteção política inglesa no comércio mundial globalizado na paz.","Os europeus ocidentais brancos representavam o topo da civilização (os 'mais aptos') e, portanto, tinham o direito e o dever de dominar as 'raças inferiores' da África para levá-las ao progresso (Fardo do Homem Branco).","O colonialismo enfraquecia as nações superiores.","A miscigenação era a única forma de evolução biológica rápida e necessária para o capital europeu prosperar na Ásia indiana colonizada pelos britânicos na era moderna pacífica liberal."],1,"Esta pseudociência foi a justificativa racista para explorar continentes inteiros, ignorando as construções sociais complexas dos povos nativos."],
  ["fil",1,"A escola estoica (Helenismo - Sêneca, Marco Aurélio) propunha que para alcançar a tranquilidade da alma (Ataraxia) a pessoa deve:",["Buscar o máximo de prazeres físicos, festas e riquezas acumuladas freneticamente antes da morte inevitável bater na porta num prazo curto biológico fatal.","Entregar-se ao sofrimento excessivo das emoções mundanas amorosas depressivas sem buscar a razão para justificar o luto crônico psicológico terminal das amizades abaladas.","Aceitar racionalmente as coisas que não pode controlar (o Destino/Natureza), controlando apenas as suas reações internas e virtudes perante os infortúnios.","Isolar-se numa caverna distante de toda a civilização humana recusando a fala comunitária com amigos em greves prolongadas políticas de revolução armada social em Roma.","Desafiar os deuses exigindo uma vida imortal no paraíso místico da mitologia grega helênica politeísta com heróis panteões em ascensão mágica mitológica no Olimpo de Zeus infinito celestialmente sagrado."],2,"O Estoicismo ensina resiliência: a dor é inevitável, mas o sofrimento prolongado é uma escolha emocional irracional e desnecessária."],
  ["fil",1,"A Sociologia Brasileira de Gilberto Freyre ('Casa-Grande & Senzala', 1933) revolucionou o estudo da formação do Brasil ao afirmar que:",["O Brasil era amaldiçoado geneticamente pela mistura de raças e que o branqueamento e imigração europeia maciça salvaria o país economicamente nas décadas futuras.","O negro e o índio foram as grandes pragas que atrasaram a industrialização sulista paulistana e imperial do século dezenove de D. Pedro II pacificamente no interior fluminense.","A mestiçagem (mistura) não era uma degeneração biológica, mas a grande riqueza formadora da cultura brasileira, embora ele tendesse a suavizar a violência brutal e explícita da escravidão.","O Brasil só existiria se voltasse a ser colônia de Portugal legalmente submissa e agrária no nordeste sem intervenções locais políticas em Pernambuco escravagista colonial no nordeste seco interiorano paulista do café."],2,"Freyre retirou a culpa biológica do brasileiro (teorias raciais antigas), elogiando a mistura de negros, portugueses e indígenas (mito da democracia racial)."],
  ["fil",1,"Sobre a cultura, o conceito de 'Apropriação Cultural' ocorre, criticamente, quando:",["Um grupo dominante adota elementos culturais de um grupo minoritário/oprimido esvaziando-os de seu sentido histórico e lucrando com isso, enquanto os criadores originais continuam marginalizados.","Pessoas de diferentes países trocam receitas na internet livremente de forma pacífica num blog culinário sem lucro nenhum em inglês e francês e português.","Ninguém pode comer pizza a não ser que tenha passaporte italiano e viva em Roma legalmente aprovado pela prefeitura local.","Grupos oprimidos adotam as roupas da elite dominante para tentar invisibilidade na cidade moderna capitalista globalizada e rápida.","As indústrias param de fabricar roupas inspiradas na Ásia temendo processos internacionais.","Você come comida asiática num restaurante brasileiro."],0,"O problema não é o intercâmbio natural, mas sim as relações de poder: o branco é elogiado por usar tranças de moda, enquanto o negro era discriminado pelas mesmas tranças (história das favelas)."],
  ["fil",1,"Qual é a visão da Sociologia atual sobre a divisão de classes no Brasil?",["O Brasil não tem mais classes sociais desde a abolição da escravatura, sendo um país estritamente igualitário.","A classe média e a classe alta dominam a renda, mas a tributação justa e equitativa europeia eliminou a miséria nordestina das capitais em 2010 totalmente no sertão rural afastado isolado.","Existe uma estrutura profundamente hierarquizada e desigual (herança escravista e agrária), com concentração de riqueza no topo e um imenso contingente de trabalhadores precarizados e periféricos na base.","O Brasil vive um sistema socialista disfarçado desde os anos 80, onde os empresários são pobres e o proletariado é isento de impostos e rico no sudeste urbano tecnológico e de serviços no campo agrário paulista e sulista próspero e plano gaúcho frio extremo climático sem chuvas constantes."],2,"A herança colonial gerou uma estrutura excludente, com a população negra e pobre marginalizada fisicamente (favelas) e economicamente (trabalho informal)."],
  ["fil",1,"Jean-Paul Sartre, o ícone do Existencialismo francês, afirmou que 'A existência precede a essência'. Isso significa que:",["Deus criou a nossa 'essência' e destino antes mesmo de nascermos no planeta físico material denso doloroso terreno temporário humano.","Nascemos no mundo sem nenhum destino ou natureza predefinida; através das nossas escolhas e atos (liberdade), nós construímos quem somos e a nossa 'essência' a cada dia.","Os seres humanos são iguais aos objetos (como um machado), que são pensados e desenhados pelo ferreiro antes de existirem.","A biologia e a genética ditam 100% dos nossos comportamentos e ações desde a infância.","Nós apenas existimos temporariamente antes de reencarnar eternamente no infinito sem escolha.","Somos robôs biológicos programados e controlados mentalmente sem escolha de viver."],1,"O homem não tem destino traçado. Ele é 'condenado a ser livre' e é totalmente responsável pelo que decide fazer da sua vida num mundo absurdo."],
  ["fil",1,"Na Teoria da Ideologia de Karl Marx, a Ideologia funciona como:",["A verdade científica mais pura revelada pelas matemáticas exatas na revolução moderna dos transportes e ferrovias.","Um conjunto de ilusões e falsas verdades espalhadas pela classe dominante (burguesia) para enganar a classe dominada (proletariado) e convencê-la de que o sistema é justo, natural e divino.","A manifestação espiritual da paz nas aldeias isoladas da Revolução Francesa e Revolução Russa moderna bélica atómica espacial na década de sessenta da Guerra Fria soviética americana norte global sem lei alguma escrita em pedra maciça grega do panteão romano dos césares bárbaros do norte da europa nevada escura medieval religiosa."],1,"A ideologia (como o 'Mito da Meritocracia' ou a religião no passado) inverte a realidade, fazendo o oprimido aceitar a sua exploração pacificamente sem se revoltar contra o patrão."],
  ["fil",1,"A escola positivista (Auguste Comte) cunhou o lema 'Ordem e Progresso' (na bandeira do Brasil). Qual era a crença principal do Positivismo no século XIX?",["Acreditar em fantasmas e no misticismo asiático como base para a medicina ocidental contemporânea de hospitais públicos.","Defender a anarquia e a destruição total das fábricas para viver numa floresta primitiva isolada.","A crença de que apenas a ciência rigorosa (ciências exatas e biológicas) traria a ordem social definitiva e o progresso da humanidade, superando a religião e as superstições velhas de forma autoritária e elitista cientificista em Paris centralizada.","Que a guerra constante e a invasão de países fracos garantiriam o lucro eterno no ocidente democrático representativo indireto republicano burguês iluminista francês.","O foco total nas leis metafísicas celestiais e ignorar a ciência biológica.","A crença na magia.","As respostas filosóficas sem provas práticas no mundo capitalista fordista taylorista mecânico automatizado computadorizado quântico interligado por antenas analógicas de rádio frequência modulada distante quilómetros dos grandes centros metropolitanos globais iluminados pela noite fria com neve intensa de Nova Iorque e Londres modernas financeiras especulativas desregulamentadas."],2,"O Positivismo exaltava a ciência como única religião válida e pregava que o desenvolvimento da sociedade dependeria apenas do controle das leis da natureza em prol da burguesia e indústria."],
